# Zet de map kinderkerk/ online via GitHub Pages, bij elke wijziging in main.
name: App online zetten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # database-code naast de hulppagina installeren.html zetten
      - run: |
          cp supabase/schema.sql kinderkerk/schema.sql
          cp supabase/agenda.sql kinderkerk/agenda.sql
          cp supabase/backup.sql kinderkerk/backup.sql
          cp supabase/uitnodigen.sql kinderkerk/uitnodigen.sql
          cp supabase/functions/agenda/index.ts kinderkerk/agenda-functie.txt
          cp google/quiz-naar-slides.gs kinderkerk/slides-script.txt
          cp supabase/meldingen.sql kinderkerk/meldingen.sql
          cp supabase/functions/meldingen/index.ts kinderkerk/meldingen-functie.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kinderkerk
      - id: deployment
        uses: actions/deploy-pages@v4
