<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kinderkerk</title>
<meta name="application-name" content="Kinderkerk">
<meta name="description" content="App voor de leiding van de kinderkerk van Evangeliegemeente De Deur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinderkerk">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1d3c9c; --brand-600:#162f7c; --brand-soft:#e9eefb;
  --bg:#f3f4f7; --card:#fff; --text:#1c2433; --muted:#6b7385; --border:#e6e8ee;
  --ok:#1f9d55; --ok-soft:#e4f5eb; --warn:#d99100; --warn-soft:#fdf3dc; --bad:#d64545; --bad-soft:#fbe7e7;
  --onder:#f08a24; --boven:#2f80ed; --bezoeker:#9b51e0;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
/* Geen inzoomen: geen dubbeltik-zoom, en invulvelden op 16px zodat de iPhone niet inzoomt bij het tikken */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px !important}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--brand)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header & navigatie (zoals Donkey) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:17px}
.brand .mini-logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--brand-soft);overflow:hidden}
.mainnav{display:none;align-self:stretch;gap:4px}
.mainnav a{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.mainnav a svg{color:var(--text)}
.mainnav a.active{border-color:var(--brand)}
.mainnav a.active svg{color:var(--brand)}
.mainnav a:hover{background:#f7f8fa}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;border:0;font:inherit;font-weight:800;cursor:pointer}
/* Onderbalk in "liquid glass"-stijl (telefoon en geïnstalleerde app) */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));
  display:flex;gap:4px;padding:6px;border-radius:30px;z-index:20;
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.38));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 10px 34px rgba(20,30,60,.18),0 2px 6px rgba(20,30,60,.08),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:24px;font-size:11.5px;font-weight:700;color:#4a5265;text-decoration:none;transition:background .2s,color .2s}
.bottomnav a.active{color:var(--brand);background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(20,30,60,.12),inset 0 1px 0 #fff}
.topbar{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
@media(min-width:800px){
  body{padding-bottom:0}
  .mainnav{display:flex}
  .bottomnav{display:none}
}
/* Als geïnstalleerde app altijd de knoppen onderin, ook op een tablet */
@media(display-mode:standalone){
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .mainnav{display:none}
  .bottomnav{display:flex}
}
html.standalone body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
html.standalone .mainnav{display:none}
html.standalone .bottomnav{display:flex}
body.loggedout .topbar,body.loggedout .bottomnav{display:none}

/* Inloggen */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 0%,#e3eafc,transparent 55%),radial-gradient(circle at 90% 100%,#e6f6ea,transparent 50%),var(--bg)}
.auth-card{width:100%;max-width:400px;padding:28px 24px;text-align:center}
.auth-card .hero-logo{width:120px;height:120px;border:0}
.auth-card h1{font-size:22px;font-weight:800;margin-bottom:6px}
.auth-card .field{text-align:left}
.auth-err{background:var(--bad-soft);color:#8f2a2a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;text-align:left}
.auth-note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.demo-box{margin-top:18px;padding:12px;border:1px dashed #e0c27a;background:var(--warn-soft);border-radius:12px;font-size:13px;text-align:left;color:#6b4b00}
.demo-box code{background:#fff;padding:1px 6px;border-radius:6px}
.mailicon{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.mailicon svg.i{width:30px;height:30px}
.role{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:6px;vertical-align:1px}

/* ---------- Pagina's ---------- */
.page{max-width:780px;margin:0 auto;padding:20px 16px 40px}
.page.wide{max-width:1080px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800}
.section-title{font-size:17px;font-weight:800;margin:22px 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}

.home-grid{display:grid;gap:16px}
@media(min-width:900px){.home-grid{grid-template-columns:320px 1fr;align-items:start}.home-grid aside{position:sticky;top:84px}}
.hero{padding:28px 20px 20px;text-align:center}
.hero-logo{width:104px;height:104px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--brand-soft);overflow:hidden}
.hero h1{font-size:22px;font-weight:800;margin-bottom:4px}
.hero p{margin:0 0 18px}
.hero-date{margin-top:14px;font-size:13px;color:var(--muted)}

/* ---------- Knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-soft:hover{background:#dce4f8}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:#f7f8fa}
.btn-danger{background:transparent;color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:#f1f2f5;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:#e7e9ee}
.textlink{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--text);text-decoration:none;background:none;border:0;font:inherit;font-weight:700;cursor:pointer;padding:0}
.textlink svg.i{width:18px;height:18px;color:var(--muted)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;font:inherit;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab svg.i{width:18px;height:18px}
.tab.active{color:var(--text);border-color:var(--brand)}
.tab .count{background:#eef0f4;color:var(--muted);font-size:12px;padding:1px 7px;border-radius:999px}
.tab.active .count{background:var(--brand-soft);color:var(--brand)}

/* ---------- Statistiek ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:span 2}}
.stat{padding:16px}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700}
.stat .num{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.stat .sub{font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ---------- Lijsten ---------- */
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;background:none;border:0;border-top:1px solid var(--border);font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:none}
.row:first-child{border-top:0}
.row:hover{background:#fafbfc}
.row.static{cursor:default}.row.static:hover{background:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main .muted{font-size:13px}
.row .chev{width:18px;height:18px;color:#a0a6b4}
.row-icon{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.list-head{padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#fafbfc;border-top:1px solid var(--border)}
.list-head:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.av-onder{background:var(--onder)}.av-boven{background:var(--boven)}.av-bezoeker{background:var(--bezoeker)}.av-leiding{background:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge svg.i{width:14px;height:14px;stroke-width:2.4}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.grey{background:#eef0f4;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ---------- Toolbar / zoeken ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:0 14px;color:var(--muted)}
.search svg.i{width:18px;height:18px}
.search input{border:0;outline:0;font:inherit;flex:1;padding:10px 0;background:transparent;color:var(--text);min-width:0}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);background:var(--brand-soft);color:#24345f;font-size:14px;margin-top:14px;flex-wrap:wrap}
.banner > span{flex:1;min-width:200px}
.banner svg.i{color:var(--brand)}

/* ---------- Formulieren ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > span{font-weight:700;font-size:14px}
.field input,.field textarea,.field select{font:inherit;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8f9fb;color:var(--text);outline:0;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.chip .tick{display:none}
.chip.on .tick{display:inline}
.hint{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:#6b4b00;border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}
.hint svg.i{color:var(--warn)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.overlay{align-items:center;padding:24px}.modal{max-width:560px;border-radius:20px}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.modal-head h2{font-size:19px;font-weight:800}
.modal-head > div{flex:1;min-width:0}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:10px;justify-content:space-between;padding:14px 20px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff}
.modal-foot .btn-primary{margin-left:auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}

/* ---------- Diversen ---------- */
.prayer{padding:14px 16px;border-top:1px solid var(--border)}
.prayer:first-child{border-top:0}
.prayer b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.note{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px}
.note:first-child{border-top:0}
.note p{margin:4px 0 0;white-space:pre-wrap}
.note .meta{font-size:12.5px;color:var(--muted)}
.duty{display:flex;align-items:center;gap:14px;padding:16px}
.duty .row-icon{width:48px;height:48px}
.duty small{display:block;font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.05em;text-transform:uppercase}
.duty b{font-size:17px}
.status{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.status svg.i{width:16px;height:16px;stroke-width:2.6}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.chart{padding:18px 16px 10px}
.chart svg{width:100%;height:auto;display:block}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 16px;background:#fafbfc}
table.t td{padding:11px 16px;border-top:1px solid var(--border)}
table.t td.c,table.t th.c{text-align:center}
table.t tr.today td{background:var(--brand-soft);font-weight:700}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fafbfc}
.okmark{color:var(--ok)}
.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:16px;cursor:pointer;text-decoration:none}
.plan:hover{background:#fafbfc}
.plan.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.plan small{display:block;font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.plan .theme{font-size:17px;font-weight:800}
.plan .lead{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:10px;font-size:14px}
.plan .lead span:nth-child(odd){color:var(--muted);font-weight:700}
.plan .prep{margin-top:10px;font-size:14px;color:#6b4b00;background:var(--warn-soft);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.me-tag{font-weight:800;color:var(--brand)}
.hero-duty{margin-top:12px;font-size:13.5px;background:var(--brand-soft);color:#24345f;border-radius:10px;padding:8px 10px}
.bday{background:#fdeef6;color:#8a2a5a}
.install-logo{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--border)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;line-height:1.45}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center}
.share-ic{display:inline-block;width:18px;height:18px;vertical-align:-3px;color:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c2433;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:800px){#toast{bottom:28px}}
.demo-flag{font-size:11px;font-weight:800;background:var(--warn-soft);color:#8a5d00;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.demo-flag ~ .avatar{margin-left:0}
@media(max-width:420px){.demo-flag{display:none}.demo-flag ~ .avatar{margin-left:auto}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home"><span class="mini-logo" id="mini-logo"></span><span>Kinderkerk</span></a>
    <nav class="mainnav" id="mainnav"></nav>
    <span class="demo-flag" style="margin-left:auto">DEMODATA</span>
    <button class="avatar" id="avatar" data-action="profile" title="Mijn account"></button>
  </div>
</header>
<main id="app"></main>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   Kinderkerk De Deur — prototype
   Alle data staat lokaal in de browser (localStorage) en is NEPDATA.
   Later vervangen we de "db"-laag door een echte database.
   ===================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const todayISO = () => iso(new Date());
function addDays(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s, opts = {day:'numeric', month:'long', year:'numeric'}){ return new Date(s + 'T12:00:00').toLocaleDateString('nl-NL', opts); }
const weekday = s => new Date(s + 'T12:00:00').getDay();
function nextSunday(s){ while (weekday(s) !== 0) s = addDays(s, 1); return s; }
const shiftYears = (s, n) => String(+s.slice(0,4) + n) + s.slice(4);
function age(birth, on = todayISO()){ let a = +on.slice(0,4) - +birth.slice(0,4); if (on.slice(5) < birth.slice(5)) a--; return a; }
/* Verjaardag binnen 6 dagen van een datum (ervoor of erna)? Geeft de datum van die verjaardag terug. */
function birthdayNear(k, T = todayISO()){
  if (!k.birthdate) return null;
  for (const y of [-1, 0, 1]){ const d = shiftYears(T, y).slice(0,4) + k.birthdate.slice(4);
    if (Math.abs(new Date(d + 'T12:00:00') - new Date(T + 'T12:00:00')) <= 6 * 864e5) return d; }
  return null;
}
const initials = name => name.split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase();
const firstName = name => name.split(' ')[0];

const PRAYERS = ['Voor opa die in het ziekenhuis ligt','Dat mijn kat weer beter wordt','Voor mijn toets op school deze week','Dat mijn vriendin naar de kinderkerk komt',
  'Voor mama die een nieuwe baan zoekt','Dank voor mijn nieuwe broertje!','Dat mijn oma snel beter wordt','Voor de mensen in landen waar oorlog is','Dat ik niet meer bang ben in het donker'];
function seed(){
  const rnd = mulberry32(7);
  const T = todayISO();
  const kids = [];
  const mk = (name, group, p, inactive) => {
    const yrs = group === 'onder' ? 4 + rnd()*4 : group === 'boven' ? 8 + rnd()*4 : 5 + rnd()*6;
    kids.push({ id:newId(), name, group, created:addDays(T,-150), birthdate:addDays(T, -Math.round(yrs * 365.25)), _p:p, _inactive:inactive });
  };
  ['Noah','Sem','Mila de Jong','Yara','Liam','Sofie Bakker','Daan','Nova','Jesse','Lotte','Amira','Finn'].forEach(n => mk(n,'onder',.35+rnd()*.6));
  ['Levi Jansen','Eva de Vries','Lucas Bakker','Julia Visser','Milan Smit','Sara Meijer','Thijs Mulder','Fenna de Boer','Ruben Bos','Isa Vos','Gideon Peters','Hannah Dekker'].forEach(n => mk(n,'boven',.35+rnd()*.6));
  ['Tobias','Ella'].forEach(n => mk(n,'bezoeker',.15));
  ['Jurre','Lieke','Mats'].forEach((n,i) => mk(n, i%2 ? 'boven' : 'onder', .7, true));

  const leaders = [['Anneke','onder'],['Mark','onder'],['Priscilla','onder'],['Ruth','onder'],['Jonathan','boven'],['Esther','boven'],['David','boven'],['Miriam','boven'],['Samuel','']]
    .map(([name,group]) => ({ id:newId(), name, group, email:name.toLowerCase() + '@demo.test', role:name === 'Jonathan' ? 'beheerder' : 'leiding' }));

  const checkins = [], leaderCheckins = [];
  for (let w = 16; w >= 0; w--){
    const date = addDays(T, -7*w);
    kids.forEach(k => {
      if (k._inactive && w < 10) return;
      if (rnd() < k._p * (w === 0 ? .65 : 1)){
        const items = [];
        if (rnd() < .7) items.push('bijbel');
        if (rnd() < .5) items.push('werkblad');
        if (rnd() < .4) items.push('geld');
        if (k.group === 'boven' && rnd() < .35) items.push('bijbeltekst');
        const prayer = rnd() < .14 ? PRAYERS[Math.floor(rnd()*PRAYERS.length)] : '';
        checkins.push({ id:newId(), kidId:k.id, date, items, prayer, by:'Jonathan' });
      }
    });
    leaders.forEach(l => { if (rnd() < (w === 0 ? .5 : .55)) leaderCheckins.push({ leaderId:l.id, date }); });
  }
  kids.forEach(k => { delete k._p; delete k._inactive; });
  kids[1].birthdate = shiftYears(addDays(T, 2), -6);     // twee kinderen jarig rond vandaag
  kids[14].birthdate = shiftYears(addDays(T, -3), -10);

  const boven = kids.filter(k => k.group === 'boven');
  const roster = offset => Array.from({length:7}, (_,i) => ({ date:addDays(T, 7*i), kidId:boven[(i+offset) % boven.length].id }));

  return {
    session:null,
    invites:[{ email:'nieuw@demo.test', group:'onder', invitedBy:'Jonathan', date:T }],
    kids, leaders, checkins, leaderCheckins,
    notes:[
      { id:newId(), date:addDays(T,-7), author:'Esther', text:'Volgende week hebben we extra lijm en scharen nodig voor het werkje.' },
      { id:newId(), date:T, author:'Mark', text:'Onderbouw begint vandaag 10 minuten later i.v.m. de doop in de dienst.' },
    ],
    rosters:{ sheets:roster(0), bidden:roster(5) },
    sundays:planLeaders(seedSundays(T), leaders),
    illnesses:[
      ['Hand-, voet- en mondziekte','ok','Mag komen, mits fit genoeg om mee te doen.'],
      ['Ringworm','ok','Mag komen, mits fit genoeg. Plek bij voorkeur bedekt.'],
      ['Hoofdluis','ok','Mag komen, mits fit genoeg. Vraag ouders om te behandelen.'],
      ['Koorts','warn','Mag komen als het kind fit genoeg is. Bij hoge koorts liever thuis.'],
      ['Griep','warn','Voorzichtigheid geboden. Afhankelijk van symptomen of besmettelijke fase.'],
      ['Waterpokken','warn','Voorzichtigheid geboden. Afhankelijk van symptomen of besmettelijke fase.'],
      ['Gordelroos','warn','Voorzichtigheid geboden. Afhankelijk van symptomen of besmettelijke fase.'],
      ['Buikgriep','warn','Voorzichtigheid geboden. Afhankelijk van symptomen of besmettelijke fase.'],
      ['Krentenbaard','bad','Helaas nu niet welkom.'],
      ['Mazelen','bad','Helaas nu niet welkom.'],
      ['Schurft','bad','Helaas nu niet welkom.'],
      ['Kinkhoest','bad','Helaas nu niet welkom.'],
    ].map(([name,status,text]) => ({ id:newId(), name, status, text })),
  };
}

const THEMES = [['Jozef en zijn broers','Genesis 37'],['Jozef in de gevangenis','Genesis 39–40'],['Jozef wordt onderkoning','Genesis 41'],
  ['Jozef vergeeft zijn broers','Genesis 45'],['Mozes in het biezen mandje','Exodus 2'],['De brandende braamstruik','Exodus 3'],['Door de Rode Zee','Exodus 14'],['Manna in de woestijn','Exodus 16']];
function seedSundays(T){
  const S = nextSunday(T);
  return THEMES.map(([theme, passage], i) => ({ date:addDays(S, 7*(i-1)), theme, passage,
    prep:i === 1 ? 'Werkblad 20× kopiëren. Kleurpotloden aanvullen.' : i === 2 ? 'Verkleedkleren voor Jozef meenemen (mantel!).' : '', onder:[], boven:[] }));
}
/* Verdeel de leiding over de zondagen: per groep steeds twee, om de beurt */
function planLeaders(sundays, leaders){
  const pick = (grp, i) => { const l = leaders.filter(x => x.group === grp); if (!l.length) return [];
    return [...new Set([l[(2*i) % l.length], l[(2*i+1) % l.length]])].map(x => x.id); };
  sundays.forEach((s, i) => { s.onder = pick('onder', i); s.boven = pick('boven', i); });
  return sundays;
}

/* ---------- Opslag ----------
   Zonder config.js-sleutels: demomodus, alles in localStorage van deze browser.
   Met sleutels: Supabase. De app houdt dan een kopie in `db` bij, past die meteen aan
   en stuurt elke wijziging ook naar de database (put/upd/drop). */
const CFG = window.KK_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey && window.supabase);
const sb = CLOUD ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
const STORE_KEY = 'kinderkerk-demo-v3';
const emptyDb = () => ({ session:null, invites:[], kids:[], leaders:[], checkins:[], leaderCheckins:[], notes:[], rosters:{ sheets:[], bidden:[] }, sundays:[], illnesses:[] });
function load(){ try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function save(){ if (CLOUD) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch(e){} }
let db = CLOUD ? emptyDb() : load();
if (!db){ db = seed(); save(); }

/* Veldnamen in de app ↔ kolommen in de database */
const COLS = { kidId:'kid_id', leaderId:'leader_id', group:'groep', invitedBy:'invited_by', by:'checked_by' };
const REV = Object.fromEntries(Object.entries(COLS).map(([a,b]) => [b,a]));
const toRow = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [COLS[k] || k, v]));
const fromRow = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [REV[k] || k, v]));
function remote(q){
  if (!CLOUD) return;
  q.then(({ error }) => { if (error){ console.error(error); toast('Opslaan mislukt, probeer het opnieuw'); refresh(); } });
}
const put = (table, rows) => remote(sb?.from(table).upsert([].concat(rows).map(toRow)));
const upd = (table, o) => remote(sb?.from(table).update(toRow(o)).eq('id', o.id));
const drop = (table, match) => remote(sb?.from(table).delete().match(toRow(match)));

async function fetchAll(table, order){
  let out = [];
  for (let from = 0; ; from += 1000){
    let q = sb.from(table).select('*');
    order.forEach(c => { q = q.order(c); });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out = out.concat(data.map(fromRow));
    if (data.length < 1000) return out;
  }
}
async function loadCloud(){
  const [leaders, invites, kids, checkins, leaderCheckins, notes, rosters, illnesses, sundays] = await Promise.all([
    fetchAll('leaders', ['id']), fetchAll('invites', ['email']), fetchAll('kids', ['id']), fetchAll('checkins', ['id']),
    fetchAll('leader_checkins', ['date','leader_id']), fetchAll('notes', ['created_at','id']), fetchAll('rosters', ['kind','date']), fetchAll('illnesses', ['id']), fetchAll('sundays', ['date'])]);
  notes.forEach(n => delete n.created_at);
  const ro = kind => rosters.filter(r => r.kind === kind).map(({ date, kidId }) => ({ date, kidId }));
  db = { session:db.session, invites, kids, leaders, checkins, leaderCheckins, notes, rosters:{ sheets:ro('sheets'), bidden:ro('bidden') }, sundays, illnesses };
}
/* Opnieuw ophalen (na een wijziging van iemand anders); niet tekenen terwijl iemand typt of een venster open heeft */
let refreshTimer;
async function refresh(){
  if (!CLOUD || !db.session) return;
  try { await loadCloud(); } catch(e){ console.error(e); return; }
  const a = document.activeElement;
  if ($('#modal-root').innerHTML || (a && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
  render();
}
function listen(){
  sb.channel('kinderkerk').on('postgres_changes', { event:'*', schema:'public' }, () => {
    clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 700);
  }).subscribe();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
}
async function afterLogin(user){
  db.session = user.id;
  try {
    await sb.rpc('claim_invite');
    await loadCloud();
  } catch(e){ console.error(e); state.auth = { step:'email', error:'Gegevens laden lukt niet. Controleer je internet en probeer het opnieuw.' }; db.session = null; return render(); }
  const l = leaderById(user.id);
  state.auth = !l ? { step:'noaccess', email:user.email } : !l.name ? { step:'profile', email:user.email, invite:{ group:l.group } } : { step:'email' };
  render();
}
/* Demodata in de database zetten (alleen beheerder, alleen zolang we nog met nepdata werken) */
async function cloudDemo(){
  const s = seed();
  const steps = [
    () => sb.from('checkins').delete().not('id', 'is', null),
    () => sb.from('rosters').delete().not('kind', 'is', null),
    () => sb.from('notes').delete().not('id', 'is', null),
    () => sb.from('illnesses').delete().not('id', 'is', null),
    () => sb.from('sundays').delete().not('date', 'is', null),
    () => sb.from('kids').delete().not('id', 'is', null),
    () => sb.from('kids').insert(s.kids.map(toRow)),
    () => sb.from('checkins').insert(s.checkins.map(toRow)),
    () => sb.from('notes').insert(s.notes.map(toRow)),
    () => sb.from('illnesses').insert(s.illnesses.map(toRow)),
    () => sb.from('rosters').insert(Object.entries(s.rosters).flatMap(([kind, l]) => l.map(r => toRow({ kind, ...r })))),
    () => sb.from('sundays').insert(planLeaders(s.sundays, db.leaders).map(toRow)),
  ];
  toast('Bezig…');
  for (const step of steps){ const { error } = await step(); if (error){ console.error(error); toast('Mislukt: ' + error.message); return; } }
  await loadCloud(); render(); toast('Demodata staat in de database');
}

        <span class="row-main"><b>Kind ziek?</b><span class="muted">Check of een ziek kind welkom is</span></span>${icon('chev','chev')}
      </a>

    </aside>

      <div class="tabs">
        ${[['vandaag','Vandaag','calendar'],['gebed','Gebed','heart'],['notities','Notities','note']].map(([id,l,ic]) =>

    </section>

}
function homeVandaag(){
  const T = todayISO();
  const cs = checkinsOn(T);
  const g = grp => cs.filter(c => kidById(c.kidId).group === grp).length;
  const leaders = db.leaders.filter(l => leaderIn(l.id, T)).length;
  const sheets = rosterToday('sheets'), bidden = rosterToday('bidden');
  const duty = (r, label, ic) => {
    const k = r && kidById(r.kidId);
    const when = r && r.date !== T ? ` · ${fmtDate(r.date, {day:'numeric', month:'short'})}` : '';
    return `<a class="card duty" href="#/roosters" style="text-decoration:none;color:inherit"><span class="row-icon">${icon(ic)}</span>
      <span><small>${label}${when}</small><b>${k ? esc(k.name) : 'Nog niet ingepland'}</b></span></a>`;
  };
  return `
    <div class="stats">
      <div class="card stat"><div class="lbl">Kinderen vandaag</div><div class="num">${cs.length}</div>
        <div class="dots"><span><i class="dot" style="background:var(--onder)"></i>${g('onder')} onderbouw</span><span><i class="dot" style="background:var(--boven)"></i>${g('boven')} bovenbouw</span>${g('bezoeker') ? `<span><i class="dot" style="background:var(--bezoeker)"></i>${g('bezoeker')} bezoeker${g('bezoeker') > 1 ? 's' : ''}</span>` : ''}</div></div>
      <div class="card stat"><div class="lbl">Leiding</div><div class="num">${leaders}</div><div class="sub">ingecheckt</div></div>
      <div class="card stat"><div class="lbl">Totaal</div><div class="num">${cs.length + leaders}</div><div class="sub">waarvan ${leaders} leiding</div></div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <a class="btn btn-primary" href="#/checkin">${icon('checkin')} Kinderen inchecken</a>
      <button class="btn btn-soft" data-action="whoIsIn">${icon('users')} Bekijk wie ingecheckt is</button>
    </div>
    ${homeBirthdays()}
    <h3 class="section-title">${nextSunday(T) === T ? 'Vandaag' : 'Zondag ' + fmtDate(nextSunday(T), {day:'numeric', month:'long'})}</h3>
    ${planCard(nextSunday(T), true)}
    <h3 class="section-title">Vandaag ingeroosterd</h3>
    <div class="stats" style="grid-template-columns:1fr 1fr">${duty(sheets, 'Sheets', 'monitor')}${duty(bidden, 'Bidden bovenbouw', 'pray')}</div>`;
}
function homeBirthdays(){
  const T = todayISO();
  const list = db.kids.filter(isRecent).map(k => ({ k, d:birthdayNear(k) })).filter(x => x.d).sort((a,b) => a.d.localeCompare(b.d));
  if (!list.length) return '';
  return `<h3 class="section-title">🎂 Jarig deze week</h3><div class="card list">${list.map(({k,d}) => `
    <button class="row" data-action="openKid" data-id="${k.id}"><span class="av av-${k.group}">${initials(k.name)}</span>
      <span class="row-main"><b>${esc(k.name)}</b><span class="muted">${d === T ? 'Wordt vandaag' : d > T ? 'Wordt' : 'Werd'} ${age(k.birthdate, d)} jaar${d === T ? '' : ' op ' + fmtDate(d, {weekday:'long', day:'numeric', month:'short'})}</span></span>${icon('chev','chev')}</button>`).join('')}</div>`;
}
function homeGebed(){
  const T = todayISO();
  const list = checkinsOn(T).filter(c => c.prayer);
  return `
    <div class="card list">${list.length ? list.map(c => `<div class="prayer"><b>${esc(kidById(c.kidId).name)}</b>${esc(c.prayer)}</div>`).join('')

    <a class="btn btn-outline btn-block" style="margin-top:12px" href="#/gebed">${icon('arrow')} Naar de gebedslijst</a>`;

function homeNotities(){
  const notes = [...db.notes].reverse().sort((a,b) => b.date.localeCompare(a.date));
  return `
    <div class="card pad">
      <label class="field" style="margin-bottom:10px"><span>Nieuwe notitie</span><textarea id="note-text" rows="3" placeholder="Bijv. iets voor de leiding van volgende week…"></textarea></label>
      <button class="btn btn-primary" data-action="addNote">Opslaan</button>

        <div style="flex:1"><div class="meta"><b style="color:var(--text)">${esc(n.author)}</b> · ${fmtDate(n.date, {day:'numeric', month:'long'})}</div><p>${esc(n.text)}</p></div>
        <button class="icon-btn" title="Verwijderen" data-action="delNote" data-id="${n.id}">${icon('trash')}</button></div>`).join('')

function renderCheckin(){
  const T = todayISO();
  const tabs = [['alles','Alles tonen'],['onder','Onderbouw'],['boven','Bovenbouw'],['bezoeker','Bezoekers']];
  const countIn = grp => checkinsOn(T).filter(c => grp === 'alles' || kidById(c.kidId).group === grp).length;
  app.innerHTML = `
  <div class="page">
    <div class="tabs">${tabs.map(([id,l]) => `<button class="tab ${state.ciTab === id ? 'active' : ''}" data-action="ciTab" data-id="${id}">${l} <span class="count">${countIn(id)}</span></button>`).join('')}</div>
    <div class="page-head"><h1>Check-in${state.ciTab !== 'alles' ? ' ' + GROUPS[state.ciTab].toLowerCase() : ''}</h1>
      <span class="muted">${cap(fmtDate(T, {weekday:'long', day:'numeric', month:'long'}))}</span></div>
    <div class="toolbar">
      <label class="search">${icon('search')}<input id="ci-search" data-input="search" placeholder="Zoek een kind" value="${esc(state.search)}" autocomplete="off"></label>
      <button class="btn btn-primary" data-action="addKid">${icon('plus')} Kind</button>
    </div>
    <div class="card list" id="kidlist"></div>
    <div class="banner" id="allbanner"></div>
  </div>`;
  renderKidList();
}
function renderKidList(){
  const T = todayISO();
  const q = state.search.trim().toLowerCase();
  let kids = db.kids.filter(k => state.ciTab === 'alles' || k.group === state.ciTab);
  const hidden = kids.filter(k => !isRecent(k)).length;
  if (!state.showAll && !q) kids = kids.filter(isRecent);
  if (q) kids = kids.filter(k => k.name.toLowerCase().includes(q));
  kids.sort(byName);
  $('#kidlist').innerHTML = kids.length ? kids.map(k => {
    const c = checkinFor(k.id, T);
    const sub = (c ? (c.items.map(itemEmoji).join(' ') || 'Ingecheckt') + (c.prayer ? ' · 🙏' : '') : (state.ciTab === 'alles' ? GROUPS[k.group] : lastSeenText(k))) + (birthdayNear(k) ? ' · 🎂' : '');
    return `<button class="row" data-action="openCheckin" data-id="${k.id}">
      <span class="av av-${k.group}">${initials(k.name)}</span>
      <span class="row-main"><b>${esc(k.name)}</b><span class="muted">${sub}</span></span>
      ${c ? `<span class="badge ok">${icon('check')} Ingecheckt</span>` : `<span class="btn btn-soft sm">Inchecken</span>`}
    </button>`; }).join('')
    : `<div class="empty">${q ? `Geen kind gevonden met “${esc(state.search)}”.` : 'Geen kinderen in deze groep.'}</div>`;
  $('#allbanner').innerHTML = state.showAll
    ? `${icon('info')}<span>Je ziet nu <b>alle</b> kinderen, ook wie langer dan 60 dagen niet is geweest.</span><button class="btn btn-outline sm" data-action="toggleAll">Alleen recent</button>`
    : `${icon('info')}<span>Niet gevonden? Je ziet alleen kinderen die in de afgelopen 60 dagen zijn geweest${hidden ? ` (${hidden} verborgen)` : ''}.</span><button class="btn btn-outline sm" data-action="toggleAll">${icon('search')} Alle kinderen</button>`;
}
function lastSeenText(k){
  const ls = lastSeen(k.id);
  if (!ls) return 'Nog niet geweest';
  const weeks = Math.round((new Date(todayISO()) - new Date(ls)) / 6048e5);
  return weeks === 0 ? 'Vandaag' : weeks === 1 ? 'Vorige week geweest' : `${weeks} weken geleden`;
}

function openCheckin(kidId, date = todayISO()){
  const k = kidById(kidId); if (!k) return;
  const ex = checkinFor(kidId, date);
  const items = new Set(ex?.items || []);
  openModal(`
    <div class="modal-head"><span class="av av-${k.group}">${initials(k.name)}</span>
      <div><h2>${esc(k.name)}</h2><span class="muted">${GROUPS[k.group]}${ex ? ' · al ingecheckt' : ''}</span></div>
      <button class="icon-btn" title="Gegevens van ${esc(firstName(k.name))}" data-action="openKid" data-id="${k.id}">${icon('edit')}</button>
      <button class="icon-btn" data-action="closeModal">${icon('x')}</button></div>
    <div class="modal-body">
      ${(bd => bd ? `<div class="hint bday">🎂 ${esc(firstName(k.name))} ${bd === date ? 'is vandaag jarig en wordt' : bd > date ? 'wordt ' + fmtDate(bd, {weekday:'long'}) : 'werd ' + fmtDate(bd, {weekday:'long'})} ${age(k.birthdate, bd)} jaar!</div>` : '')(birthdayNear(k, date))}
      <label class="field"><span>Datum</span><input type="date" id="ci-date" data-change="ciDate" data-id="${k.id}" value="${date}"></label>
      <div class="field"><span>Selecteer hieronder</span>
        <div class="chips">${ITEMS.filter(i => !i.boven || k.group === 'boven').map(i =>
          `<button type="button" class="chip ${items.has(i.id) ? 'on' : ''}" data-action="toggleChip" data-id="${i.id}">${i.emoji} ${i.label}<span class="tick">✓</span></button>`).join('')}</div></div>
      <label class="field"><span>Gebedsverlangens</span><textarea id="ci-prayer" rows="3" placeholder="Vul hier eventueel gebedsverlangens in">${esc(ex?.prayer || '')}</textarea></label>
      <div class="hint">${icon('help')} Vraag of ${esc(firstName(k.name))} naar de wc moet</div>
      <div style="text-align:center"><a class="textlink" href="#/ziektes">${icon('thermo')} Kind ziek? Klik hier.</a></div>
    </div>
    <div class="modal-foot">
      ${ex ? `<button class="btn btn-danger" data-action="removeCheckin" data-id="${ex.id}">${icon('trash')} Verwijderen</button>` : ''}
      <button class="btn btn-primary" data-action="saveCheckin" data-id="${k.id}">${ex ? 'Opslaan' : 'Inchecken'}</button>
    </div>`);
}

function openKid(id){
  const k = kidById(id); if (!k) return;
  const visits = db.checkins.filter(c => c.kidId === id).sort((a,b) => b.date.localeCompare(a.date));
  const n8 = visits.filter(c => c.date > addDays(todayISO(), -56)).length;
  openModal(`
    <div class="modal-head"><span class="av av-${k.group}">${initials(k.name)}</span>
      <div><h2>${esc(k.name)}</h2><span class="muted">${k.birthdate ? age(k.birthdate) + ' jaar · ' : ''}${n8}× in de laatste 8 weken · ${lastSeenText(k).toLowerCase()}</span></div>
      <button class="icon-btn" data-action="closeModal">${icon('x')}</button></div>
    <div class="modal-body">
      <label class="field"><span>Naam</span><input id="kd-name" value="${esc(k.name)}" autocomplete="off"></label>
      <label class="field"><span>Groep</span><select id="kd-group">${Object.entries(GROUPS).map(([v,l]) => `<option value="${v}" ${v === k.group ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>Geboortedatum</span><input type="date" id="kd-birth" value="${k.birthdate || ''}" max="${todayISO()}"></label>
      <div class="field"><span>Laatste keren</span>
        <div class="card list">${visits.slice(0,8).map(c => `<div class="row static"><span class="row-main"><b>${cap(fmtDate(c.date, {weekday:'short', day:'numeric', month:'long'}))}</b>
          <span class="muted">${c.items.map(itemEmoji).join(' ') || 'Ingecheckt'}${c.prayer ? ` · 🙏 ${esc(c.prayer)}` : ''}</span></span></div>`).join('')
          || '<div class="empty">Nog niet geweest.</div>'}</div></div>
    </div>
    <div class="modal-foot">
      ${isAdmin() ? `<button class="btn btn-danger" data-action="delKid" data-id="${k.id}">${icon('trash')} Verwijderen</button>` : ''}
      <button class="btn btn-primary" data-action="saveKidEdit" data-id="${k.id}">Opslaan</button>
    </div>`);
}

function openAddKid(){

/* =====================================================================
   INLOGGEN
   Alleen wie is uitgenodigd kan een account maken; wie inlogt is leiding.
   In dit prototype wordt er geen echte mail verstuurd: de "inloglink"
   is een knop. Met de echte database komt hier echte, veilige login.
   ===================================================================== */
const validEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
function renderLogin(){
  const a = state.auth;
  let body;
  if (a.step === 'loading') body = `<h1>Kinderkerk De Deur</h1><p class="muted">Even laden…</p>`;
  else if (a.step === 'noaccess') body = `
    <h1>Geen toegang</h1>
    <p class="muted" style="margin:0 0 18px"><b style="color:var(--text)">${esc(a.email)}</b> heeft (nog) geen toegang tot de kinderkerk-app. Vraag een beheerder om je uit te nodigen.</p>
    <button class="btn btn-outline btn-block" data-action="logout">Uitloggen</button>`;
  else if (a.step === 'sent' && CLOUD) body = `
    <div class="mailicon">${icon('mail')}</div>
    <h1>Check je mail</h1>
    <p class="muted">We hebben een code gestuurd naar <b style="color:var(--text)">${esc(a.email)}</b>. Vul die hieronder in.</p>
    <form data-submit="verifyCode" style="margin-top:18px">
      <label class="field"><span>Code uit de mail</span><input id="lg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
      ${a.error ? `<div class="auth-err">${esc(a.error)}</div>` : ''}
      <button class="btn btn-primary btn-block" type="submit">Inloggen</button>
    </form>
    <button class="btn btn-outline btn-block" style="margin-top:10px" data-action="authBack">Ander e-mailadres</button>`;
  else if (a.step === 'sent') body = `
    <div class="mailicon">${icon('mail')}</div>
    <h1>Check je mail</h1>
    <p class="muted">We hebben een inloglink gestuurd naar <b style="color:var(--text)">${esc(a.email)}</b>. De link werkt maar één keer.</p>
    <button class="btn btn-primary btn-block" style="margin-top:18px" data-action="openLink">Inloglink openen (demo)</button>
    <button class="btn btn-outline btn-block" style="margin-top:10px" data-action="authBack">Ander e-mailadres</button>`;
  else if (a.step === 'profile') body = `
    <h1>Welkom bij het team!</h1>
    <p class="muted" style="margin:0 0 18px">Je bent uitgenodigd als leiding. Vul nog even je gegevens in.</p>
    <label class="field"><span>Je naam</span><input id="pf-name" autocomplete="name" placeholder="Voornaam"></label>
    <label class="field"><span>Groep</span><select id="pf-group">
      <option value="onder" ${a.invite?.group === 'onder' ? 'selected' : ''}>Onderbouw</option>
      <option value="boven" ${a.invite?.group === 'boven' ? 'selected' : ''}>Bovenbouw</option>
      <option value="" ${!a.invite?.group ? 'selected' : ''}>Algemeen</option></select></label>
    ${a.error ? `<div class="auth-err">${esc(a.error)}</div>` : ''}
    <button class="btn btn-primary btn-block" data-action="createAccount">Account aanmaken</button>`;
  else body = `
    <h1>Kinderkerk De Deur</h1>
    <p class="muted" style="margin:0 0 20px">Log in als leiding</p>
    <form data-submit="sendLink">
      <label class="field"><span>E-mailadres</span><input id="lg-email" type="email" autocomplete="email" inputmode="email" placeholder="naam@voorbeeld.nl" value="${esc(a.email || '')}"></label>
      ${a.error ? `<div class="auth-err">${esc(a.error)}</div>` : ''}
      <button class="btn btn-primary btn-block" type="submit" ${a.busy ? 'disabled' : ''}>${icon('mail')} ${a.busy ? 'Bezig…' : CLOUD ? 'Stuur inlogcode' : 'Stuur inloglink'}</button>
    </form>
    ${showInstall() ? `<button class="textlink" style="margin-top:16px" data-action="install">${icon('download')} Installeer als app</button>` : ''}
    <p class="auth-note">Geen wachtwoord nodig: je krijgt een eenmalige ${CLOUD ? 'code' : 'link'} in je mail. Alleen leiding die is uitgenodigd kan inloggen.</p>
    ${CLOUD ? '' : `<div class="demo-box"><b>Demo-accounts</b><br>

      <code>esther@demo.test</code> leiding<br>
      <code>nieuw@demo.test</code> uitgenodigd, nog geen account</div>`}`;
  app.innerHTML = `<div class="auth"><div class="card auth-card">

/* ---------- Historie ---------- */
function renderHistorie(){
  const T = todayISO();
  const from = addDays(T, -7*16);
  const counts = {};
  db.checkins.forEach(c => { if (c.date >= from && c.date <= T && kidById(c.kidId)) counts[c.date] = (counts[c.date] || 0) + 1; });
  const dates = Object.keys(counts).sort();
  const avg = dates.length ? Math.round(dates.reduce((s,d) => s + counts[d], 0) / dates.length) : 0;
  const max = Math.max(5, ...Object.values(counts));

  const W = 720, H = 260, pl = 30, pb = 34, pt = 18, cw = W - pl - 10, ch = H - pb - pt;
  const step = Math.ceil(max / 5 / 5) * 5 || 5, top = Math.ceil(max / step) * step;
  const bw = Math.min(30, cw / Math.max(dates.length, 1) * .6);
  let svg = '';
  for (let v = 0; v <= top; v += step){ const y = pt + ch - v / top * ch;
    svg += `<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#eceef2"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a91a1">${v}</text>`; }
  dates.forEach((d,i) => {
    const x = pl + (i + .5) * cw / dates.length, h = counts[d] / top * ch, y = pt + ch - h;
    svg += `<rect x="${x - bw/2}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${d === T ? 'var(--brand)' : '#8fa3e0'}"><title>${fmtDate(d)}: ${counts[d]} kinderen</title></rect>
      <text x="${x}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2433">${counts[d]}</text>
      <text x="${x}" y="${H - 12}" text-anchor="middle" font-size="10.5" fill="#8a91a1">${fmtDate(d, {day:'numeric', month:'short'}).replace('.', '')}</text>`;
  });

  const eightWeeks = addDays(T, -56);
  const rows = grp => db.kids.filter(k => k.group === grp && isRecent(k)).sort(byName).map(k => {
    const n = db.checkins.filter(c => c.kidId === k.id && c.date > eightWeeks).length;
    return `<tr class="click" data-action="openKid" data-id="${k.id}"><td><b>${esc(k.name)}</b></td><td class="muted">${lastSeen(k.id) ? fmtDate(lastSeen(k.id), {day:'numeric', month:'short'}) : '—'}</td>
      <td class="c">${n}×</td><td class="c">${n >= 4 ? `<span class="okmark">${icon('check')}</span>` : '<span class="muted">–</span>'}</td></tr>`; }).join('');
  const table = (grp) => `<h3 class="section-title">${GROUPS[grp]}</h3><div class="card list" style="overflow-x:auto"><table class="t">
    <thead><tr><th>Naam</th><th>Laatst</th><th class="c">8 wkn</th><th class="c">1×/2 wk</th></tr></thead><tbody>${rows(grp) || '<tr><td colspan="4" class="muted">Geen kinderen</td></tr>'}</tbody></table></div>`;

  app.innerHTML = `
  <div class="page">
    <div class="page-head"><h1>Historie</h1><span class="muted">Gemiddeld ${avg} kinderen per keer</span></div>
    <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aantal kinderen per zondag">${svg}</svg></div>
    <div class="banner">${icon('info')}<span>Hieronder zie je de kinderen die in de afgelopen 60 dagen zijn geweest. Een vinkje betekent: minstens 4 keer in de laatste 8 weken.</span></div>
    ${table('onder')}${table('boven')}${table('bezoeker')}
  </div>`;
}

/* =====================================================================
   Modal, toast, events
   ===================================================================== */
function openModal(html){
  $('#modal-root').innerHTML = `<div class="overlay" data-action="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
}
function closeModal(){ $('#modal-root').innerHTML = ''; document.body.classList.remove('noscroll'); }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

const actions = {
  go: d => { location.hash = '#/' + d.to; },
  overlay: (d, el, e) => { if (e.target === el) closeModal(); },
  closeModal: () => closeModal(),
  homeTab: d => { state.homeTab = d.id; render(); },
  ciTab: d => { state.ciTab = d.id; render(); },
  rosterTab: d => { state.rosterTab = d.id; render(); },
  toggleAll: () => { state.showAll = !state.showAll; renderKidList(); },
  leaderCheckin: () => openLeaderCheckin(),
  whoIsIn: () => openWhoIsIn(),
  toggleLeader: d => {
    const T = todayISO();
    const row = { leaderId:d.id, date:T };
    if (leaderIn(d.id, T)){ db.leaderCheckins = db.leaderCheckins.filter(l => !(l.leaderId === d.id && l.date === T)); drop('leader_checkins', row); }
    else { db.leaderCheckins.push(row); put('leader_checkins', row); }
    save(); render(); openLeaderCheckin();
  },
  openCheckin: d => openCheckin(d.id),
  toggleChip: (d, el) => el.classList.toggle('on'),
  saveCheckin: d => {
    const date = $('#ci-date').value || todayISO();
    const items = [...document.querySelectorAll('.chip.on')].map(c => c.dataset.id);
    const prayer = $('#ci-prayer').value.trim();
    const ex = checkinFor(d.id, date);
    const c = ex ? Object.assign(ex, { items, prayer }) : { id:newId(), kidId:d.id, date, items, prayer, by:me().name };
    if (!ex) db.checkins.push(c);
    put('checkins', c);
    save(); closeModal(); render();
    toast(`${firstName(kidById(d.id).name)} is ${ex ? 'bijgewerkt' : 'ingecheckt'} ✓`);
  },
  removeCheckin: d => {
    const c = db.checkins.find(x => x.id === d.id);
    if (!c || !confirm(`Check-in van ${kidById(c.kidId).name} verwijderen?`)) return;
    db.checkins = db.checkins.filter(x => x.id !== d.id); drop('checkins', { id:d.id });
    save(); closeModal(); render(); toast('Check-in verwijderd');
  },
  addKid: () => openAddKid(),
  saveKid: () => {
    const name = $('#kid-name').value.trim();
    if (!name){ $('#kid-name').focus(); return; }
    const kid = { id:newId(), name, group:$('#kid-group').value, created:todayISO(), birthdate:$('#kid-birth').value || null };
    db.kids.push(kid); put('kids', kid); save();
    state.search = ''; render(); openCheckin(kid.id);
  },
  openKid: d => openKid(d.id),
  install: async () => {
    if (!installPrompt) return openInstallHelp();
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome !== 'accepted') render();
  },
  hideInstall: () => { try { localStorage.setItem('kk-install-hidden', '1'); } catch(e){} render(); toast('Je vindt dit ook onder Meer'); },
  editPlan: (d, el, e) => { e.preventDefault(); openEditPlan(d.date); },
  morePlan: () => { state.planCount += 8; render(); },
  savePlan: d => {
    const ids = sel => [...document.querySelectorAll(sel + ' .chip.on')].map(c => c.dataset.id);
    const s = { date:d.date, theme:$('#pl-theme').value.trim(), passage:$('#pl-passage').value.trim(), prep:$('#pl-prep').value.trim(), onder:ids('#pl-onder'), boven:ids('#pl-boven') };
    db.sundays = db.sundays.filter(x => x.date !== d.date).concat(s);
    put('sundays', s); save(); closeModal(); render(); toast('Planning opgeslagen');
  },
  saveKidEdit: d => {
    const name = $('#kd-name').value.trim();
    if (!name){ $('#kd-name').focus(); return; }
    const data = { name, group:$('#kd-group').value, birthdate:$('#kd-birth').value || null };
    Object.assign(kidById(d.id), data);
    upd('kids', { id:d.id, ...data });
    save(); closeModal(); render(); toast('Gegevens opgeslagen');
  },
  delKid: d => {
    const k = kidById(d.id);
    if (!isAdmin() || !k || !confirm(`${k.name} verwijderen? Ook alle check-ins van dit kind worden verwijderd.`)) return;
    db.kids = db.kids.filter(x => x.id !== k.id);
    db.checkins = db.checkins.filter(c => c.kidId !== k.id);
    Object.values(db.rosters).forEach(list => list.forEach(r => { if (r.kidId === k.id) r.kidId = null; }));
    drop('kids', { id:k.id });
    save(); closeModal(); render(); toast(`${k.name} verwijderd`);
  },
  addNote: () => {
    const text = $('#note-text').value.trim(); if (!text) return;
    const n = { id:newId(), date:todayISO(), author:me().name, text };
    db.notes.push(n); put('notes', n); save(); render(); toast('Notitie opgeslagen');
  },
  delNote: d => { if (!confirm('Notitie verwijderen?')) return; db.notes = db.notes.filter(n => n.id !== d.id); drop('notes', { id:d.id }); save(); render(); },
  editLeader: d => { if (isAdmin()) openEditLeader(d.id); },
  saveLeader: d => {
    if (!isAdmin()) return;
    const name = $('#ld-name').value.trim(); if (!name) return;
    const l = leaderById(d.id);
    Object.assign(l, { name, group:$('#ld-group').value });
    if (l.id !== db.session) l.role = $('#ld-role').value;
    upd('leaders', { id:l.id, name:l.name, group:l.group, role:l.role });
    save(); closeModal(); render();
  },
  delLeader: d => {
    if (!isAdmin() || d.id === db.session) return;
    if (!confirm(`Toegang van ${leaderById(d.id).name} intrekken? Diegene kan dan niet meer inloggen.`)) return;
    db.leaders = db.leaders.filter(l => l.id !== d.id); drop('leaders', { id:d.id }); save(); closeModal(); render();
  },
  invite: () => { if (isAdmin()) openInvite(); },
  saveInvite: () => {
    const email = $('#inv-email').value.trim().toLowerCase();
    const err = msg => { $('#inv-err').innerHTML = `<div class="auth-err">${esc(msg)}</div>`; };
    if (!validEmail(email)) return err('Vul een geldig e-mailadres in.');
    if (db.leaders.some(l => l.email === email)) return err('Dit e-mailadres heeft al een account.');
    if (db.invites.some(i => i.email === email)) return err('Dit e-mailadres is al uitgenodigd.');
    const inv = { email, group:$('#inv-group').value, invitedBy:me().name, date:todayISO() };
    db.invites.push(inv); put('invites', inv);
    save(); closeModal(); render(); toast(CLOUD ? 'Uitgenodigd: laat diegene inloggen in de app' : 'Uitnodiging verstuurd');
  },
  delInvite: d => { db.invites = db.invites.filter(i => i.email !== d.email); drop('invites', { email:d.email }); save(); render(); },
  profile: () => openProfile(),
  logout: async () => {
    if (CLOUD){ await sb.auth.signOut(); db = emptyDb(); }
    db.session = null; save(); closeModal(); state.auth = { step:'email' }; location.hash = '#/home'; render();
  },
  sendLink: async () => {
    const email = $('#lg-email').value.trim().toLowerCase();
    if (!validEmail(email)){ state.auth = { step:'email', email, error:'Vul een geldig e-mailadres in.' }; return render(); }
    if (CLOUD){
      state.auth = { step:'email', email, busy:true }; render();
      const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
      if (!error){ state.auth = { step:'sent', email }; return render(); }
      console.error(error);
      const msg = error.status === 429 || /rate|seconds/i.test(error.message) ? 'Je hebt het net al geprobeerd. Wacht even en probeer het opnieuw.'
        : /database|uitgenodigd|signup/i.test(error.message) ? 'Dit e-mailadres is (nog) niet uitgenodigd. Vraag een beheerder van de kinderkerk om je uit te nodigen.'
        : 'Er ging iets mis. Controleer je internet en probeer het opnieuw.';
      state.auth = { step:'email', email, error:msg }; return render();
    }
    const known = db.leaders.some(l => l.email === email) || db.invites.some(i => i.email === email);
    if (!known){ state.auth = { step:'email', email, error:'Dit e-mailadres is (nog) niet uitgenodigd. Vraag een beheerder van de kinderkerk om je uit te nodigen.' }; return render(); }
    state.auth = { step:'sent', email }; render();
  },
  verifyCode: async () => {
    const token = $('#lg-code').value.replace(/\s/g, '');
    if (!token) return $('#lg-code').focus();
    const { data, error } = await sb.auth.verifyOtp({ email:state.auth.email, token, type:'email' });
    if (error){ state.auth.error = 'Deze code klopt niet of is verlopen. Probeer het opnieuw of vraag een nieuwe code.'; return render(); }
    afterLogin(data.user);
  },
  authBack: () => { state.auth = { step:'email', email:state.auth.email }; render(); },
  openLink: () => {
    const email = state.auth.email;
    const l = db.leaders.find(x => x.email === email);
    if (l){ db.session = l.id; save(); state.auth = { step:'email' }; render(); toast(`Welkom, ${l.name}!`); return; }
    state.auth = { step:'profile', email, invite:db.invites.find(i => i.email === email) }; render();
  },
  createAccount: () => {
    const name = $('#pf-name').value.trim();
    if (!name){ state.auth.error = 'Vul je naam in.'; return render(); }
    if (CLOUD){
      Object.assign(me(), { name, group:$('#pf-group').value });
      upd('leaders', { id:db.session, name, group:me().group });
      state.auth = { step:'email' }; render(); toast(`Welkom bij het team, ${name}!`); return;
    }
    const l = { id:newId(), name, group:$('#pf-group').value, email:state.auth.email, role:'leiding' };
    db.leaders.push(l);
    db.invites = db.invites.filter(i => i.email !== l.email);
    db.session = l.id; save(); state.auth = { step:'email' }; render(); toast(`Welkom bij het team, ${name}!`);
  },
  editRoster: d => openEditRoster(d.date),
  setRoster: d => {
    const list = db.rosters[state.rosterTab]; const r = list.find(x => x.date === d.date);
    const kidId = d.id || null;
    if (r) r.kidId = kidId; else list.push({ date:d.date, kidId });
    put('rosters', { kind:state.rosterTab, date:d.date, kidId });
    save(); closeModal(); render();
  },
  extendRoster: () => {
    const list = db.rosters[state.rosterTab];
    const boven = db.kids.filter(k => k.group === 'boven').sort(byName);
    if (!boven.length) return;
    let last = list.reduce((m,r) => r.date > m ? r.date : m, addDays(todayISO(), -7));
    let idx = Math.max(0, boven.findIndex(k => k.id === list.find(r => r.date === last)?.kidId));
    const added = [];
    for (let i = 0; i < 4; i++){ last = addDays(last, 7); idx = (idx + 1) % boven.length; added.push({ date:last, kidId:boven[idx].id }); }
    list.push(...added); put('rosters', added.map(r => ({ kind:state.rosterTab, ...r })));
    save(); render(); toast('4 weken toegevoegd');
  },
  csvRoster: () => {
    const T = todayISO();
    const rows = db.rosters[state.rosterTab].filter(r => r.date >= T).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 20);
    const csv = 'Datum;Naam\n' + rows.map(r => `${fmtDate(r.date)};${kidById(r.kidId)?.name || ''}`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }));
    a.download = `rooster-${state.rosterTab}.csv`; a.click(); URL.revokeObjectURL(a.href);
  },
  openZiekte: d => openZiekte(d.id),
  editZiekte: d => { if (isAdmin()) openEditZiekte(d.id); },
  saveZiekte: d => {
    if (!isAdmin()) return;
    const name = $('#zk-name').value.trim();
    if (!name){ $('#zk-name').focus(); return; }
    const data = { name, status:$('#zk-status').value, text:$('#zk-text').value.trim() };
    const z = db.illnesses.find(x => x.id === d.id);
    const row = z ? Object.assign(z, data) : { id:newId(), ...data };
    if (!z) db.illnesses.push(row);
    put('illnesses', row);
    save(); closeModal(); render(); toast('Opgeslagen');
  },
  delZiekte: d => {
    const z = db.illnesses.find(x => x.id === d.id);
    if (!isAdmin() || !z || !confirm(`${z.name} verwijderen?`)) return;
    db.illnesses = db.illnesses.filter(x => x.id !== z.id); drop('illnesses', { id:z.id });
    save(); closeModal(); render();
  },
  resetDemo: () => {
    if (CLOUD){ if (isAdmin() && confirm('Alle kinderen, check-ins, roosters, notities en ziektes in de database vervangen door verzonnen data?')) cloudDemo(); return; }
    if (!confirm('Alle demodata opnieuw laden? Je wijzigingen gaan verloren.')) return; const email = me().email; db = seed(); db.session = db.leaders.find(l => l.email === email)?.id || null; save(); toast('Demodata opnieuw geladen'); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.input;
  if (k === 'search'){ state.search = e.target.value; renderKidList(); }
  if (k === 'zsearch'){ state.zSearch = e.target.value; renderZList(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset?.change === 'ciDate') openCheckin(e.target.dataset.id, e.target.value || todayISO());
});
document.addEventListener('submit', e => {
  const k = e.target.dataset?.submit; if (!k) return;
  e.preventDefault(); actions[k]?.();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// iPhone negeert user-scalable=no in Safari; knijp-zoom daarom ook hier tegenhouden
['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
window.addEventListener('hashchange', router);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

$('#mini-logo').innerHTML = logoImg();
if (CLOUD){
  state.auth = { step:'loading' }; router();
  sb.auth.getSession().then(({ data }) => {
    if (data.session) afterLogin(data.session.user); else { state.auth = { step:'email' }; render(); }
  });
  listen();
} else router();
</script>
</body>
</html>
