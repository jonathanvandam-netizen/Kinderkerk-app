try { const t = localStorage.getItem('kk-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch(e){}
</script>
<style>
:root{
  --brand:#1d3c9c; --brand-600:#162f7c; --brand-soft:#e9eefb; --brand-soft-2:#dce4f8; --brand-text:#24345f;
  --bg:#f3f4f7; --card:#fff; --text:#1c2433; --muted:#6b7385; --border:#e6e8ee;
  --surface-2:#f7f8fa; --surface-3:#eef0f4; --surface-4:#e7e9ee; --input:#f8f9fb;
  --ok:#1f9d55; --ok-soft:#e4f5eb; --warn:#d99100; --warn-soft:#fdf3dc; --warn-text:#6b4b00; --bad:#d64545; --bad-soft:#fbe7e7; --bad-text:#8f2a2a;
  --bday-bg:#fdeef6; --bday-text:#8a2a5a;
  --qz-a:#e5484d; --qz-b:#1d7ae0; --qz-c:#d98e1f; --qz-d:#8e4ec6;
  --onder:#f08a24; --boven:#2f80ed; --bezoeker:#9b51e0;
  --nav-text:#4a5265; --toast:#1c2433; --toast-text:#fff; --overlay:rgba(17,24,39,.45);
  --glass-1:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.38); --glass-border:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.9); --glass-lo:rgba(255,255,255,.25); --glass-active:rgba(255,255,255,.75); --topbar:rgba(255,255,255,.78);
  --auth-a:#e3eafc; --auth-b:#e6f6ea;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
/* Donkere modus: automatisch (volgt het toestel) of zelf gekozen via Mijn account → Weergave */
html[data-theme="dark"]{color-scheme:dark;
  --brand:#5b7ee6; --brand-600:#4a6cd6; --brand-soft:#232f52; --brand-soft-2:#2b3a66; --brand-text:#c9d5ff;
  --bg:#0e131d; --card:#181e2b; --text:#e6e9f0; --muted:#98a1b3; --border:#283043;
  --surface-2:#1e2535; --surface-3:#252d40; --surface-4:#2e374d; --input:#121825;
  --ok:#3ccf7e; --ok-soft:#163626; --warn:#f0b43c; --warn-soft:#352b13; --warn-text:#f3d08a; --bad:#f07272; --bad-soft:#3a1d22; --bad-text:#ffb4b4;
  --bday-bg:#3a1e32; --bday-text:#ffb8dc;
  --qz-a:#c9393e; --qz-b:#2468b8; --qz-c:#b5761a; --qz-d:#7a40b0;
  --nav-text:#b4bccc; --toast:#e6e9f0; --toast-text:#0e131d; --overlay:rgba(0,0,0,.6);
  --glass-1:rgba(36,43,61,.72); --glass-2:rgba(28,34,50,.55); --glass-border:rgba(255,255,255,.1);
  --glass-hi:rgba(255,255,255,.08); --glass-lo:rgba(255,255,255,.03); --glass-active:rgba(255,255,255,.12); --topbar:rgba(20,26,39,.82);
  --auth-a:#1b2648; --auth-b:#13281c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){ html:not([data-theme="light"]){color-scheme:dark;
  --brand:#5b7ee6; --brand-600:#4a6cd6; --brand-soft:#232f52; --brand-soft-2:#2b3a66; --brand-text:#c9d5ff;
  --bg:#0e131d; --card:#181e2b; --text:#e6e9f0; --muted:#98a1b3; --border:#283043;
  --surface-2:#1e2535; --surface-3:#252d40; --surface-4:#2e374d; --input:#121825;
  --ok:#3ccf7e; --ok-soft:#163626; --warn:#f0b43c; --warn-soft:#352b13; --warn-text:#f3d08a; --bad:#f07272; --bad-soft:#3a1d22; --bad-text:#ffb4b4;
  --bday-bg:#3a1e32; --bday-text:#ffb8dc;
  --qz-a:#c9393e; --qz-b:#2468b8; --qz-c:#b5761a; --qz-d:#7a40b0;
  --nav-text:#b4bccc; --toast:#e6e9f0; --toast-text:#0e131d; --overlay:rgba(0,0,0,.6);
  --glass-1:rgba(36,43,61,.72); --glass-2:rgba(28,34,50,.55); --glass-border:rgba(255,255,255,.1);
  --glass-hi:rgba(255,255,255,.08); --glass-lo:rgba(255,255,255,.03); --glass-active:rgba(255,255,255,.12); --topbar:rgba(20,26,39,.82);
  --auth-a:#1b2648; --auth-b:#13281c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.25)} }
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
/* Geen inzoomen: geen dubbeltik-zoom, en invulvelden op 16px zodat de iPhone niet inzoomt bij het tikken */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px !important}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--brand)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header & navigatie (zoals Donkey) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:17px}
.brand .mini-logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--brand-soft);overflow:hidden}
.mainnav{display:none;align-self:stretch;gap:4px}
.mainnav a{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.mainnav a svg{color:var(--text)}
.mainnav a.active{border-color:var(--brand)}
.mainnav a.active svg{color:var(--brand)}
.mainnav a:hover{background:var(--surface-2)}
.sync{margin-left:auto;font-size:12.5px;font-weight:800;background:var(--warn-soft);color:var(--warn-text);padding:5px 10px;border-radius:999px;white-space:nowrap}
.sync[hidden]{display:none}
.sync:not([hidden]) + .avatar{margin-left:8px}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;border:0;font:inherit;font-weight:800;cursor:pointer}
/* Onderbalk in "liquid glass"-stijl (telefoon en geïnstalleerde app) */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(480px,calc(100% - 24px));
  display:flex;gap:4px;padding:6px;border-radius:30px;z-index:20;
  background:linear-gradient(135deg,var(--glass-1),var(--glass-2));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 10px 34px rgba(20,30,60,.18),0 2px 6px rgba(20,30,60,.08),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:24px;font-size:11px;font-weight:700;color:var(--nav-text);min-width:0;white-space:nowrap;text-decoration:none;transition:background .2s,color .2s}
@media(max-width:440px){.bottomnav a{font-size:10px;letter-spacing:-.2px}}
@media(max-width:374px){.bottomnav{gap:1px;padding:5px}.bottomnav a{font-size:8.6px;letter-spacing:-.3px}}
.bottomnav a.active{color:var(--brand);background:var(--glass-active);box-shadow:0 1px 4px rgba(20,30,60,.12),inset 0 1px 0 var(--glass-hi)}
.topbar{background:var(--topbar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
@media(min-width:1000px){
  body{padding-bottom:0}
  .mainnav{display:flex}
  .bottomnav{display:none}
}
/* Als geïnstalleerde app altijd de knoppen onderin, ook op een tablet */
@media(display-mode:standalone){
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .mainnav{display:none}
  .bottomnav{display:flex}
}
html.standalone body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
html.standalone .mainnav{display:none}
html.standalone .bottomnav{display:flex}
body.loggedout .topbar,body.loggedout .bottomnav{display:none}

/* Inloggen */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 0%,var(--auth-a),transparent 55%),radial-gradient(circle at 90% 100%,var(--auth-b),transparent 50%),var(--bg)}
.auth-card{width:100%;max-width:400px;padding:28px 24px;text-align:center}
.auth-card .hero-logo{width:120px;height:120px;border:0}
.auth-card h1{font-size:22px;font-weight:800;margin-bottom:6px}
.auth-card .field{text-align:left}
.auth-err{background:var(--bad-soft);color:var(--bad-text);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;text-align:left}
.auth-note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.demo-box{margin-top:18px;padding:12px;border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;font-size:13px;text-align:left;color:var(--warn-text)}
.demo-box code{background:var(--card);padding:1px 6px;border-radius:6px}
.mailicon{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.mailicon svg.i{width:30px;height:30px}
.role{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:6px;vertical-align:1px}

/* ---------- Pagina's ---------- */
.page{max-width:780px;margin:0 auto;padding:20px 16px 40px}
.page.wide{max-width:1080px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800}
.section-title{font-size:17px;font-weight:800;margin:22px 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}

.home-grid{display:grid;gap:16px}
.home-grid > *{min-width:0}   /* anders duwen brede tabbladen de pagina breder dan het scherm */

@media(min-width:760px){.home-grid{grid-template-columns:300px 1fr;align-items:start}.home-grid aside{position:sticky;top:84px}}
/* Begroeting bovenaan Home */
.hello{padding:16px}
.hello-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hello-logo{width:56px;height:56px;border-radius:50%;overflow:hidden;border:3px solid var(--brand-soft);flex:none}
.hello h1{font-size:20px;font-weight:800}
.hello-date{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:2px}
.hello .hero-duty{margin:0 0 12px}
/* Tellers in één kaart */
.stats1{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0 12px}
.stats1 .cell{padding:0 16px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.stats1 .cell .lbl svg.i{width:13px;height:13px;vertical-align:-1px;opacity:.6}
.stats1 .cell + .cell{border-left:1px solid var(--border)}
.stats1 .lbl{font-size:13px;color:var(--muted);font-weight:700}
.stats1 .num{font-size:30px;font-weight:800;line-height:1.15}
.stats1 .dots{grid-column:1/-1;border-top:1px solid var(--border);margin-top:10px;padding:10px 16px 0}
.btn-row.two{display:grid;grid-template-columns:1fr 1fr}
.btn-row.two .btn{padding-left:10px;padding-right:10px}
/* Inchecken: datum klein bovenaan */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:16px;color:var(--muted);font-size:14px}
.datebar span{display:flex;align-items:center;gap:6px}
.datebar svg.i{width:18px;height:18px}
.av-wrap{position:relative;flex:none;display:flex}
.away-badge{position:absolute;right:-6px;bottom:-5px;width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 2px var(--card)}
.absent-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 6px 6px 12px;font-size:15px;font-weight:400}
.absent-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.absent-dates label{display:flex;flex-direction:column;gap:2px;font-weight:400;font-size:13px}
#absent-box input{font:inherit;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--input);color:var(--text);width:100%}
.hero-duty.clash{background:var(--warn-soft);color:var(--warn-text)}.hero-duty.clash a{color:inherit;font-weight:800;margin-left:4px}
.away-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.away-presets .chip{padding:5px 10px;font-size:13.5px}
.check-line{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin:-4px 0 14px;cursor:pointer}
.check-line input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.points-card{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--surface-2)}
.points-card b{font-size:24px;font-weight:800}
.pts{color:var(--warn-text);font-weight:700;white-space:nowrap}
table.t.pt-table th,table.t.pt-table td{padding:10px 4px}table.t.pt-table th{text-transform:none;letter-spacing:0;font-size:13px}table.t.pt-table td:first-child,table.t.pt-table th:first-child{padding-left:14px;white-space:nowrap}
.pt-table input{width:52px;text-align:center;font:inherit;font-weight:700;border:1px solid var(--border);border-radius:10px;padding:8px 6px;background:var(--input);color:var(--text)}
.hint.soft{font-weight:600;font-size:14px;padding:10px 12px}
/* Vergadering */
.eyebrow{display:block;font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.meet-next .big{font-size:20px;font-weight:800}
.meet-next .btn{margin-top:14px}
.addrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);margin:0}
.list .addrow:first-child{border-top:0}
.addrow input{flex:1;font:inherit;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--input);color:var(--text);min-width:0;outline:0}
.addrow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--card);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;padding:0}
.check svg.i{width:16px;height:16px;stroke-width:2.8}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.action .row-main{cursor:pointer}
.action .row-main b{white-space:normal}
.late-count{color:var(--bad);font-size:14px;font-weight:700}
.quiz-play{padding:18px 20px 22px;display:flex;flex-direction:column;gap:18px;min-height:60vh}
.qp-top{display:flex;justify-content:space-between;align-items:center}
.qp-q{font-size:30px;font-weight:800;line-height:1.25;flex:1;display:flex;align-items:center}
.qp-a{font-size:24px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:16px;padding:16px 18px}
.qp-nav{justify-content:space-between}
.qp-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qp-opt{display:flex;align-items:center;gap:10px;border-radius:14px;padding:14px;color:#fff;font:inherit;font-weight:700;font-size:18px;line-height:1.25;border:0;text-align:left;cursor:pointer;min-height:64px;transition:transform .1s}
.qp-opt:active{transform:scale(.97)}.qp-opt:disabled{cursor:default}
.qp-opt b{font-size:22px}.qp-opt .i{margin-left:auto;width:26px;height:26px}
.qp-opt.c0{background:var(--qz-a)}.qp-opt.c1{background:var(--qz-b)}.qp-opt.c2{background:var(--qz-c)}.qp-opt.c3{background:var(--qz-d)}
.qp-opt.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);animation:qpPop .35s ease-out}.qp-opt.dim{opacity:.3}
.qp-opt.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft);animation:qpShake .4s}
.qp-res{border-radius:14px;padding:14px 16px;font-size:20px;font-weight:800;text-align:center;animation:qpPop .35s ease-out}
.qp-res.good{background:var(--ok-soft);color:var(--ok)}.qp-res.bad{background:var(--bad-soft);color:var(--bad-text);font-size:17px;font-weight:600}
.qp-hint{text-align:center;font-size:14px}
@keyframes qpPop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes qpShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qf-opt{display:flex;gap:8px;align-items:center;margin-bottom:8px}.qf-opt input{flex:1}
.qf-letter{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.qf-letter.on{background:var(--ok);border-color:var(--ok);color:#fff}
.qf-have{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;line-height:1.5}
.qf-have-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:8px 0;margin-top:6px;font:inherit;font-size:15px;color:var(--text);cursor:pointer}
.qf-have-row span{flex:1}.qf-have-row .i{width:18px;height:18px;color:var(--muted)}
.quiz-btn{margin-top:10px}
@media(min-width:640px){.modal:has(.quiz-play){max-width:820px}.qp-q{font-size:40px}.qp-a{font-size:30px}}
.terugblik{position:relative;background:linear-gradient(135deg,var(--brand-soft),var(--card))}
.terugblik .big{font-size:20px;font-weight:800;margin:4px 0 2px;padding-right:36px}
.terugblik .tb-x{position:absolute;top:10px;right:10px}
.tb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tb-stat{background:var(--brand-soft);border-radius:14px;padding:12px 6px;text-align:center}
.tb-stat b{display:block;font-size:26px;font-weight:800;color:var(--brand)}
.tb-stat span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block}
.tb-lines{display:flex;flex-direction:column;gap:10px}
.tb-line{display:flex;gap:10px;line-height:1.45}
.tb-line>span:first-child{font-size:20px;flex:none;width:26px;text-align:center}
.row.action.late,.row.action.late:hover{background:var(--bad-soft)}
.action.late .late-tag{color:var(--bad);font-weight:800}
.action.done .row-main b{text-decoration:line-through;color:var(--muted)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg.i{width:17px;height:17px}
.agenda{padding:14px 16px}
.agenda .ag-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.agenda .num{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.agenda .ag-title{flex:1;font:inherit;font-weight:800;border:0;background:transparent;color:var(--text);padding:4px 0;min-width:0;outline:0}

<script>
/* =====================================================================
   Kinderkerk De Deur — prototype
   Alle data staat lokaal in de browser (localStorage) en is NEPDATA.
   Later vervangen we de "db"-laag door een echte database.
   ===================================================================== */

const APP_VERSION = '2026-10-19 · 54';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const todayISO = () => iso(new Date());
function addDays(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s, opts = {day:'numeric', month:'long', year:'numeric'}){ return new Date(s + 'T12:00:00').toLocaleDateString('nl-NL', opts); }
const weekday = s => new Date(s + 'T12:00:00').getDay();
function nextSunday(s){ while (weekday(s) !== 0) s = addDays(s, 1); return s; }
const shiftYears = (s, n) => String(+s.slice(0,4) + n) + s.slice(4);
function age(birth, on = todayISO()){ let a = +on.slice(0,4) - +birth.slice(0,4); if (on.slice(5) < birth.slice(5)) a--; return a; }
/* Verjaardag binnen 6 dagen van een datum (ervoor of erna)? Geeft de datum van die verjaardag terug. */
function birthdayNear(k, T = todayISO()){
  if (!k.birthdate) return null;
  for (const y of [-1, 0, 1]){ const d = shiftYears(T, y).slice(0,4) + k.birthdate.slice(4);
    if (Math.abs(new Date(d + 'T12:00:00') - new Date(T + 'T12:00:00')) <= 6 * 864e5) return d; }
  return null;
}
/* Verjaardag om bij het inchecken te vieren: van 6 dagen ervoor tot 4 weken erna (vaak trakteert een kind later) */
function birthdayCycle(k, T = todayISO()){
  if (!k.birthdate) return null;
  for (const y of [-1, 0, 1]){ const d = shiftYears(T, y).slice(0,4) + k.birthdate.slice(4), diff = (new Date(T + 'T12:00:00') - new Date(d + 'T12:00:00')) / 864e5;
    if (diff >= -6 && diff <= 28) return d; }
  return null;
}
/* Al gezongen voor deze verjaardag? Geeft de datum terug (een andere check-in dan exceptId) */
function sungFor(k, bd, exceptId){
  const c = db.checkins.find(x => x.kidId === k.id && x.id !== exceptId && x.items.includes('jarig') && x.date >= addDays(bd, -6) && x.date <= addDays(bd, 60));
  return c ? c.date : null;
}

function removeDemoKids(){
  const demo = new Set(db.kids.filter(isDemoKid).map(k => k.id));
  db.kids = db.kids.filter(k => !demo.has(k.id));
  db.checkins = db.checkins.filter(c => !demo.has(c.kidId));
  db.marks = db.marks.filter(m => !demo.has(m.kidId));
  Object.values(db.rosters).forEach(list => list.forEach(r => { if (demo.has(r.kidId)) r.kidId = null; }));
  demo.forEach(id => drop('kids', { id }));   // database: check-ins gaan automatisch mee, roosterplekken worden leeg
  save();

function seed(){
  const rnd = mulberry32(7);
  const T = todayISO();
  const kids = [];
  const mk = (name, group, p, inactive) => {
    const yrs = group === 'onder' ? 4 + rnd()*4 : group === 'boven' ? 8 + rnd()*4 : 5 + rnd()*6;
    kids.push({ id:newId(), demo:true, name, group, created:addDays(T,-150), birthdate:addDays(T, -Math.round(yrs * 365.25)), _p:p, _inactive:inactive });
  };
  DEMO_KIDS.onder.forEach(n => mk(n,'onder',.35+rnd()*.6));
  DEMO_KIDS.boven.forEach(n => mk(n,'boven',.35+rnd()*.6));
  DEMO_KIDS.bezoeker.forEach(n => mk(n,'bezoeker',.15));
  DEMO_KIDS.weg.forEach((n,i) => mk(n, i%2 ? 'boven' : 'onder', .7, true));

  // Echte leiding (alleen voornamen). Alleen Jonathan heeft een account; de rest is nog niet uitgenodigd.
  const leaders = [['Jonathan','boven'],['Nora','boven'],['Julian','boven'],['Jamilla','boven'],['Sandy','boven','Zwangerschapsverlof'],
    ['Melissa','onder'],['Dina','onder'],['Tim','onder'],['Chanel','onder']]
    .map(([name, group, away]) => { const id = newId(), admin = name === 'Jonathan';
      return { id, userId:admin ? id : null, name, group, email:admin ? 'jonathan@demo.test' : '', role:admin ? 'beheerder' : 'leiding', invited:admin, away:away || '' }; });
  const anchor = demoAnchor(T);

  const checkins = [], leaderCheckins = [];
  for (let w = 16; w >= 0; w--){
    const date = addDays(T, -7*w);
    kids.forEach(k => {
      if (k._inactive && w < 10) return;
      if (rnd() < k._p * (w === 0 ? .65 : 1)){
        const items = [];
        if (rnd() < .7) items.push('bijbel');
        if (rnd() < .5) items.push('werkblad');
        if (rnd() < .4) items.push('geld');
        if (k.group === 'boven' && rnd() < .35) items.push('bijbeltekst');
        const prayer = rnd() < .14 ? PRAYERS[Math.floor(rnd()*PRAYERS.length)] : '';
        checkins.push({ id:newId(), kidId:k.id, date, items, prayer, by:'Jonathan' });
      }
    });
    const d = dienst(date, leaders, anchor);
    [...d.onder, ...d.boven].forEach(id => leaderCheckins.push({ leaderId:id, date }));
  }
  kids.forEach(k => { delete k._p; delete k._inactive; });
  kids[1].birthdate = shiftYears(addDays(T, 2), -6);     // twee kinderen jarig rond vandaag
  kids[14].birthdate = shiftYears(addDays(T, -3), -10);

  const boven = kids.filter(k => k.group === 'boven');
  const roster = offset => Array.from({length:6}, (_,i) => ({ date:addDays(demoAnchor(T), -7*(i+1)), kidId:boven[(i+offset) % boven.length].id }));   // eerdere keren

  return {
    session:null,

/* Het echte leidingrooster van De Deur (vanaf 18-10-2026 = "anker"):
   bovenbouw wisselt elke week (Jonathan+Nora / Julian+Jamilla);
   onderbouw 2 weken achter elkaar, dan 2 weken vrij (Melissa+Dina / Tim+Chanel; 18-10 was de 2e week van Melissa+Dina). */
const demoAnchor = T => weekday(T) === 0 ? T : addDays(nextSunday(T), -7);
function dienst(date, leaders, anchor){
  const i = Math.round((new Date(date + 'T12:00:00') - new Date(anchor + 'T12:00:00')) / 6048e5);
  const ids = names => names.map(n => leaders.find(l => l.name === n)?.id).filter(Boolean);
  const even = x => ((x % 2) + 2) % 2 === 0;
  return { boven:ids(even(i) ? ['Jonathan','Nora'] : ['Julian','Jamilla']),
           onder:ids(even(Math.floor((i + 1) / 2)) ? ['Melissa','Dina'] : ['Tim','Chanel']) };
}

  db.agenda = db.agenda.filter(a => !OLD_AGENDA.has(a.title));

function whoListRaw(a){ return Array.isArray(a.who) ? a.who : a.who ? [a.who] : []; }

/* Veldnamen in de app ↔ kolommen in de database */
const COLS = { kidId:'kid_id', leaderId:'leader_id', group:'groep', userId:'user_id', by:'checked_by', themeBoven:'theme_boven', passageBoven:'passage_boven', meetingId:'meeting_id', agendaId:'agenda_id' };
const REV = Object.fromEntries(Object.entries(COLS).map(([a,b]) => [b,a]));
const toRow = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [COLS[k] || k, v]));
const fromRow = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [REV[k] || k, v]));
/* ---------- Opslaan, ook zonder internet ----------
   Elke wijziging gaat eerst in een wachtrij (outbox) die op het toestel bewaard blijft, en wordt dan één voor één naar de
   database gestuurd (volgorde blijft, zodat bijv. een vergadering bestaat vóór het eerste agendapunt). Lukt dat niet omdat
   er geen internet is, dan blijft de wijziging wachten en gaat hij vanzelf zodra er weer verbinding is.
   De laatst geladen gegevens staan ook op het toestel (kk-cache), zodat de app zonder internet opent. */
const OUTBOX_KEY = 'kk-outbox', CACHE_KEY = 'kk-cache';
let outbox = (() => { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || []; } catch(e){ return []; } })();
let flushing = false, retryTimer = null, offline = false, sessionUser = null;
const keepOutbox = () => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch(e){} };
function enqueue(op){ if (!CLOUD) return; outbox.push(op); keepOutbox(); syncBadge(); flush(); }
const put = (table, rows) => enqueue({ t:'upsert', table, rows:[].concat(rows).map(toRow) });
const upd = (table, o) => enqueue({ t:'update', table, row:toRow(o), id:o.id });
const drop = (table, match) => enqueue({ t:'delete', table, match:toRow(match) });
const isNetErr = r => r.status === 0 || !navigator.onLine || /fetch|network|load failed|timed? ?out/i.test(r.error?.message || '');
async function flush(){
  if (!CLOUD || flushing || !outbox.length) return;
  flushing = true; clearTimeout(retryTimer);
  let failed = false, sent = 0;
  while (outbox.length){
    const op = outbox[0];
    const q = op.t === 'upsert' ? sb.from(op.table).upsert(op.rows) : op.t === 'update' ? sb.from(op.table).update(op.row).eq('id', op.id) : sb.from(op.table).delete().match(op.match);
    let r; try { r = await q; } catch(e){ r = { error:{ message:String(e) }, status:0 }; }
    if (r.error && (isNetErr(r) || r.status === 401) && (op.tries = (op.tries || 0) + 1) < 200){   // geen internet (of inlog wordt vernieuwd): straks opnieuw
      offline = true; keepOutbox(); retryTimer = setTimeout(flush, 15000); break;
    }
    if (r.error){ console.error(op, r.error); failed = true; }
    outbox.shift(); keepOutbox(); sent++;
  }
  flushing = false;
  if (!outbox.length){
    if (offline){ offline = false; toast('Weer verbinding: alles is opgeslagen ✓'); }
    if (failed){ toast('Een wijziging kon niet worden opgeslagen'); refresh(); }
    else if (sent) scheduleRefresh();
  }
  syncBadge();
}
function syncBadge(){
  const el = $('#sync'); if (!el) return;
  const n = outbox.length;
  el.hidden = !CLOUD || (!n && !offline);
  el.textContent = offline ? `Geen internet${n ? ` · ${n} wacht${n === 1 ? '' : 'en'}` : ''}` : `Opslaan… ${n}`;
}
function saveCache(){
  if (!CLOUD || !db.session || !sessionUser) return;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ user:sessionUser, saved:Date.now(), db })); } catch(e){}
}
function readCache(){ try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e){ return null; } }
addEventListener('online', () => { flush(); refresh(); });
addEventListener('offline', () => { offline = true; syncBadge(); });

async function fetchAll(table, order){
  let out = [];
  for (let from = 0; ; from += 1000){
    let q = sb.from(table).select('*');
    order.forEach(c => { q = q.order(c); });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out = out.concat(data.map(fromRow));
    if (data.length < 1000) return out;
  }
}
async function loadCloud(){
  const [leaders, kids, checkins, leaderCheckins, notes, rosters, illnesses, sundays, periods, meetings, agenda, actions, settingRows, marks] = await Promise.all([
    fetchAll('leaders', ['id']), fetchAll('kids', ['id']), fetchAll('checkins', ['id']),
    fetchAll('leader_checkins', ['date','leader_id']), fetchAll('notes', ['created_at','id']), fetchAll('rosters', ['kind','date']), fetchAll('illnesses', ['id']), fetchAll('sundays', ['date']), fetchAll('periods', ['start']),
    fetchAll('meetings', ['date','id']), fetchAll('agenda_items', ['sort','id']), fetchAll('actions', ['created_at','id']), fetchAll('settings', ['key']), fetchAll('marks', ['created_at','id'])]);
  db = { session:db.session, ...dbFromRows({ leaders, kids, checkins, leaderCheckins, notes, rosters, illnesses, sundays, periods, meetings, agenda, actions, settingRows, marks }) };
}
/* Rijen uit de database (al omgezet met fromRow) → de vorm van db in de app */
function dbFromRows({ leaders = [], kids = [], checkins = [], leaderCheckins = [], notes = [], rosters = [], illnesses = [], sundays = [], periods = [], meetings = [], agenda = [], actions = [], settingRows = [], marks = [] }){
  notes.forEach(n => delete n.created_at);
  [...agenda, ...actions].forEach(x => delete x.created_at);
  const ro = kind => rosters.filter(r => r.kind === kind).map(({ date, kidId }) => ({ date, kidId }));
  return { kids, leaders, checkins, leaderCheckins, notes, rosters:{ sheets:ro('sheets'), bidden:ro('bidden') }, sundays, periods, meetings, agenda, actions, illnesses, marks,
    settings:Object.fromEntries(settingRows.map(r => [r.key, r.value])) };
}
/* Opnieuw ophalen (na een wijziging van iemand anders); niet tekenen terwijl iemand typt of een venster open heeft */
let refreshTimer;
const scheduleRefresh = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 700); };
async function refresh(){
  if (!CLOUD || !db.session) return;
  if (outbox.length){ flush(); return; }   // eerst eigen wijzigingen versturen, anders verdwijnen ze even uit beeld
  const before = db.session;
  try { await loadCloud(); } catch(e){ console.error(e); if (isNetErr({ error:e })){ offline = true; syncBadge(); } return; }
  offline = false; syncBadge(); saveCache();
  if (!leaderById(before)){ db.session = null; state.auth = { step:'noaccess', email:'' }; return render(); }   // toegang ingetrokken
  const a = document.activeElement;
  if ($('#modal-root').innerHTML || (a && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
  render();
}
function listen(){
  sb.channel('kinderkerk').on('postgres_changes', { event:'*', schema:'public' }, scheduleRefresh).subscribe();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ flush(); refresh(); } });
}
async function afterLogin(user){
  db.session = null; sessionUser = user.id;
  try {
    await sb.rpc('claim_invite');
    await loadCloud();
  } catch(e){
    console.error(e);
    if (openFromCache(user.id)) return;   // geen internet: verder met de gegevens op dit toestel
    state.auth = { step:'email', error:'Gegevens laden lukt niet. Controleer je internet en probeer het opnieuw.' }; db.session = null; return render();
  }
  const l = db.leaders.find(x => x.userId === user.id && x.invited);
  db.session = l ? l.id : null;
  offline = false; saveCache(); flush();
  state.auth = !l ? { step:'noaccess', email:user.email } : !l.name ? { step:'profile', email:user.email, invite:{ group:l.group } } : { step:'email' };
  render();
}

/* Zonder internet openen met de gegevens die op dit toestel bewaard zijn */
function openFromCache(userId){
  const c = readCache();
  if (!c || !c.db?.session || (userId && c.user !== userId)) return false;
  db = c.db; sessionUser = c.user; offline = true; state.auth = { step:'email' };
  render(); syncBadge();
  return true;
}

/* ---------- Data-hulpjes ---------- */
const kidById = id => db.kids.find(k => k.id === id);
const leaderById = id => db.leaders.find(l => l.id === id);
const me = () => leaderById(db.session) || { name:'', group:'', role:'leiding' };
const isAdmin = () => me().role === 'beheerder';
const checkinsOn = d => db.checkins.filter(c => c.date === d && kidById(c.kidId));
const checkinFor = (kidId, d) => db.checkins.find(c => c.kidId === kidId && c.date === d);
/* Leiding is er als die op de planning staat (automatisch), of als die extra is ingecheckt */
const leaderPlanned = (id, d) => { const s = sundayOf(d); return s.onder.includes(id) || s.boven.includes(id); };
const leaderExtra = (id, d) => db.leaderCheckins.some(l => l.leaderId === id && l.date === d);
const leaderIn = (id, d) => leaderPlanned(id, d) || leaderExtra(id, d);
function lastSeen(kidId){ let m = ''; for (const c of db.checkins) if (c.kidId === kidId && c.date > m) m = c.date; return m; }
const isActive = k => !k.inactive;                                           // "Komt niet meer" = inactive
const isRecent = k => isActive(k) && (lastSeen(k.id) || k.created) >= addDays(todayISO(), -60);
const cameRecently = k => isActive(k) && lastSeen(k.id) >= addDays(todayISO(), -60);   // echt ingecheckt, niet alleen net toegevoegd
const byName = (a,b) => a.name.localeCompare(b.name, 'nl');
/* Periodes: 7 weken, week 6 = bidden, week 7 = puntenwinkeltje + vergadering (om en om klein/groot) */
const periodsSorted = () => [...(db.periods || [])].sort((a,b) => a.start.localeCompare(b.start));
const periodEnd = p => addDays(p.start, 7*(PERIOD_WEEKS-1));
function weekInfo(date){
  const p = periodsSorted().filter(x => x.start <= date).pop();
  if (!p) return null;
  const week = Math.round((new Date(date + 'T12:00:00') - new Date(p.start + 'T12:00:00')) / 6048e5) + 1;
  return week > PERIOD_WEEKS ? null : { p, week, special:week === 6 ? 'Bidden' : week === 7 ? 'Puntenwinkeltje' : '' };
}
/* Thema per groep: themeBoven leeg = zelfde als onderbouw */
const periodTheme = (p, grp) => grp === 'boven' && p.themeBoven ? p.themeBoven : p.theme;
const periodSplit = p => !!p.themeBoven && p.themeBoven !== p.theme;
const periodLabel = p => periodSplit(p) ? `${p.theme} / ${p.themeBoven}` : p.theme;
const defaultTheme = (date, grp = 'onder') => { const w = weekInfo(date); return w ? w.special || periodTheme(w.p, grp) : ''; };
/* Onderwerp en Bijbelgedeelte van een zondag per groep. Bovenbouw leeg = zelfde als onderbouw,
   behalve als de periode voor de bovenbouw een eigen thema heeft. */
function sundayTopic(date, grp){
  const s = sundayOf(date), w = weekInfo(date), split = w && periodSplit(w.p);
  if (grp === 'onder') return { theme:s.theme || defaultTheme(date, 'onder'), passage:s.passage };
  return { theme:s.themeBoven || (split ? defaultTheme(date, 'boven') : s.theme || defaultTheme(date, 'boven')),
           passage:s.passageBoven || (split ? '' : s.passage) };
}
const meetingLabel = m => m === 'groot' ? 'Grote vergadering' : 'Kleine vergadering';
function weekTags(date){
  const w = weekInfo(date); if (!w) return '';
  const own = !!(sundayOf(date).theme || sundayOf(date).themeBoven);   // eigen onderwerp? Dan bidden/puntenwinkeltje als label
  return `<div class="tags"><span class="tag brand">Week ${w.week} van ${PERIOD_WEEKS} · ${esc(periodLabel(w.p))}</span>
    ${w.week === 6 && own ? '<span class="tag">🙏 Bidden</span>' : ''}
    ${w.week === 7 && own ? '<span class="tag">🛍️ Puntenwinkeltje</span>' : ''}
    ${w.week === 7 ? `<span class="tag warn">👥 ${meetingLabel(w.p.meeting)}</span>` : ''}</div>`;
}
const sundayOf = date => db.sundays.find(s => s.date === date) || { date, theme:'', passage:'', themeBoven:'', passageBoven:'', prep:'', onder:[], boven:[] };
/* Afwezig: elke leiding geeft in Mijn account zelf op wanneer hij niet kan. Opslag in de bestaande tabel notes,
   text = 'afwezig:{"leader","from","to","why"}' (geen extra database-stap). De planning zet dan ⚠️ bij die naam. */
const ABSENT_PREFIX = 'afwezig:';
const absentOf = n => { if (!n.text || !n.text.startsWith(ABSENT_PREFIX)) return null; try { return JSON.parse(n.text.slice(ABSENT_PREFIX.length)); } catch(e){ return null; } };
const absences = id => db.notes.map(n => ({ n, a:absentOf(n) })).filter(x => x.a && x.a.leader === id).sort((a,b) => a.a.from.localeCompare(b.a.from));
const absentOn = (id, d) => absences(id).find(x => x.a.from <= d && d <= (x.a.to || x.a.from))?.a || null;
const plannedOn = (id, d) => { const s = sundayOf(d); return s.onder.includes(id) || s.boven.includes(id); };
/* Zondagen waarop ik ingepland sta maar niet kan (vanaf vandaag) */

function swapLink(date){

  return `https://wa.me/?text=${encodeURIComponent(text)}`;
}

let TOUR = TOUR_ALL, tourStep = -1;
function tourTarget(st){
  const sels = st.nav ? (st.nav.startsWith('#') ? [st.nav] : [`#bottomnav a[href="#/${st.nav}"]`, `#mainnav a[href="#/${st.nav}"]`]) : [].concat(st.el || []);
  for (const sel of sels){ const e = [...document.querySelectorAll(sel)].find(x => x.offsetParent !== null && x.getBoundingClientRect().width); if (e) return e; }
  return null;
}
function startTour(){ closeModal(); TOUR = TOUR_ALL.filter(st => !st.only || st.only()); tourStep = 0; showTourStep(); }
function endTour(){ const st = TOUR[tourStep]; tourStep = -1; $('#tour')?.remove(); if (st?.open) closeModal(); try { localStorage.setItem('kk-tour', '1'); } catch(e){} }
function showTourStep(){
  const st = TOUR[tourStep]; if (!st) return;
  if (!st.open) closeModal();
  if (st.route && state.route !== st.route){ location.hash = '#/' + st.route; return; }   // de router tekent de pagina en daarna de stap
  if (st.open && !$('#modal-root').innerHTML){ st.open(); setTimeout(drawTour, 700); }
  setTimeout(drawTour, 60);
}
function drawTour(){
  if (tourStep < 0) return;
  const st = TOUR[tourStep], last = tourStep === TOUR.length - 1;
  let el = tourTarget(st);
  if (el && !st.nav){ const r = el.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 110) el.scrollIntoView({ block:'center' }); }
  let box = $('#tour');
  if (!box){ box = document.createElement('div'); box.id = 'tour'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); document.body.appendChild(box); }
  box.innerHTML = `<div class="tour-block"></div><div class="tour-spot ${el ? '' : 'none'}"></div>
    <div class="tour-card"><div class="tour-progress"><i style="width:${Math.round((tourStep + 1) / TOUR.length * 100)}%"></i></div>
      <span class="tour-step">Stap ${tourStep + 1} van ${TOUR.length}</span><h3>${st.t}</h3><p>${typeof st.p === 'function' ? st.p() : st.p}</p>
      <div class="tour-foot">
        ${tourStep > 0 && !last ? `<button class="btn btn-outline sm" data-action="tourPrev">Terug</button>` : ''}
        ${!last ? `<button class="btn btn-soft sm" data-action="tourEnd">Stoppen</button>` : ''}
        <button class="btn btn-primary sm" data-action="${last ? 'tourEnd' : 'tourNext'}">${last ? 'Aan de slag' : tourStep === 0 ? 'Start' : 'Volgende'}</button></div></div>`;
  const spot = box.querySelector('.tour-spot'), card = box.querySelector('.tour-card');
  const H = innerHeight, w = Math.min(360, innerWidth - 32);
  Object.assign(card.style, { right:'auto', margin:'0', width:w + 'px', left:(innerWidth - w) / 2 + 'px' });
  const ch = card.offsetHeight;
  if (el && !st.nav){   // past het kaartje niet boven of onder? Schuif het onderdeel dan naar boven
    const r = el.getBoundingClientRect();
    if (H - r.bottom - 20 < ch + 12 && r.top - 20 < ch + 12){
      el.scrollIntoView({ block:'start' });
      if (!el.closest('.modal')) scrollBy(0, -80);
    }
  }
  if (el){
    const r = el.getBoundingClientRect(), pad = 6, top = Math.max(4, r.top - pad), bottom = Math.min(H - 4, r.bottom + pad);
    Object.assign(spot.style, { left:r.left - pad + 'px', top:top + 'px', width:r.width + pad*2 + 'px', height:bottom - top + 'px' });
    const below = H - bottom - 14, above = top - 14;
    card.style.top = (below >= ch + 12 ? bottom + 14 : above >= ch + 12 ? top - 14 - ch : Math.max(12, H - ch - 12)) + 'px';
    card.style.left = Math.min(innerWidth - w - 16, Math.max(16, r.left + r.width / 2 - w / 2)) + 'px';
  } else card.style.top = Math.max(12, (H - ch) / 2) + 'px';
}

const meetingKindLabel = k => k === 'groot' ? 'Grote vergadering' : 'Kleine vergadering';
function nextMeetingInfo(){
  const T = todayISO();
  const list = db.meetings.filter(m => m.date >= T).map(m => ({ date:m.date, kind:m.kind, m }));
  const p = periodsSorted().find(x => periodEnd(x) >= T);
  if (p && !list.some(x => x.date === periodEnd(p))) list.push({ date:periodEnd(p), kind:p.meeting, m:null });
  return list.sort((a,b) => a.date.localeCompare(b.date))[0] || null;

/* ---------- Terugblik op een periode ----------
   Vanaf het begin van de vergadering in week 7 (12:45) tot 3 weken later staat er een kaart op Home en bij Vergadering.
   Wegdrukken onthoudt dit toestel (localStorage kk-terugblik). Bij de vergadering van week 7 blijft hij altijd te openen. */
const TERUGBLIK_KEY = 'kk-terugblik';
const terugblikHidden = () => { try { return JSON.parse(localStorage.getItem(TERUGBLIK_KEY) || '[]'); } catch(e){ return []; } };
const terugblikOpen = p => new Date() >= new Date(periodEnd(p) + 'T12:45:00');
function currentTerugblik(){
  const T = todayISO(), hidden = terugblikHidden();
  return periodsSorted().filter(p => terugblikOpen(p) && T <= addDays(periodEnd(p), 21) && !hidden.includes(p.id) && terugblikData(p).days).pop() || null;
}
function terugblikData(p){
  const T = todayISO();
  const dates = Array.from({ length:PERIOD_WEEKS }, (_, i) => addDays(p.start, 7*i)).filter(d => d <= T);
  // per week (zondag t/m zaterdag), zodat een check-in op een andere dag ook meetelt
  const inWeek = (date, d) => date >= d && date <= addDays(d, 6);
  const per = dates.map(d => ({ d, cs:db.checkins.filter(c => inWeek(c.date, d) && kidById(c.kidId)) })).filter(x => x.cs.length);
  const cs = per.flatMap(x => x.cs), days = [...new Set(cs.map(c => c.date))];
  const firstSeen = {}; db.checkins.forEach(c => { if (!firstSeen[c.kidId] || c.date < firstSeen[c.kidId]) firstSeen[c.kidId] = c.date; });
  const kids = [...new Set(cs.map(c => c.kidId))].map(kidById).filter(Boolean);
  const nieuw = kids.filter(k => days.includes(firstSeen[k.id])).sort(byName);
  const trouw = per.length > 1 ? kids.filter(k => per.every(x => x.cs.some(c => c.kidId === k.id))).sort(byName) : [];
  const leiding = db.leaders.filter(l => [...days, ...per.map(x => x.d)].some(d => leaderIn(l.id, d))).length;
  return { days:per.length, avg:per.length ? Math.round(cs.length / per.length) : 0, nieuw, trouw, leiding };
}

function meetingText(m){
  const long = d => fmtDate(d, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const items = agendaOf(m.id), acts = db.actions.filter(x => x.meetingId === m.id);
  const nextM = nextMeetingAfter(m.date), notulist = leaderById(m.notulist);
  const act = x => { const w = whoNames(x).join(', '); return `• ${x.text}${w ? ' – ' + w : ''}${x.due ? ` (vóór ${fmtDate(x.due, {day:'numeric', month:'short'})})` : ''}`; };
  const lines = [`Meeting kinderkerk leiding – ${meetingKindLabel(m.kind).toLowerCase()}`, '', 'ALGEMEEN', `Datum: ${long(m.date)}`];
  if (notulist) lines.push(`Notulist: ${notulist.name}`);
  if (nextM) lines.push(`Volgende meeting: ${long(nextM.date)} (${meetingKindLabel(nextM.kind).toLowerCase()})`);
  if (items.length){ lines.push('', 'AGENDA'); items.forEach(a => lines.push('• ' + a.title)); }
  const withNotes = items.filter(a => a.notes);
  if (withNotes.length){ lines.push('', 'NOTULEN'); withNotes.forEach(a => { lines.push(a.title); a.notes.split('\n').filter(Boolean).forEach(l => lines.push('• ' + l)); lines.push(''); }); }
  const open = acts.filter(x => !x.done), done = acts.filter(x => x.done);
  const byItem = list => { const out = []; items.forEach(a => { const l = list.filter(x => x.agendaId === a.id); if (l.length){ out.push(a.title); l.forEach(x => out.push(act(x))); } });
    const loose = list.filter(x => !x.agendaId || !items.some(a => a.id === x.agendaId)); if (loose.length){ out.push('Overig'); loose.forEach(x => out.push(act(x))); } return out; };
  if (open.length){ lines.push('ACTIEPUNTEN'); lines.push(...byItem(open)); lines.push(''); }
  if (done.length){ lines.push('REEDS UITGEVOERD'); done.forEach(x => lines.push(act(x))); }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
/* Eerstvolgende vergadering na een datum (opgeslagen, of week 7 van een periode) */
function nextMeetingAfter(date){
  const list = db.meetings.filter(x => x.date > date).map(x => ({ date:x.date, kind:x.kind }));
  periodsSorted().forEach(p => { const d = periodEnd(p); if (d > date && !list.some(x => x.date === d)) list.push({ date:d, kind:p.meeting }); });
  return list.sort((a,b) => a.date.localeCompare(b.date))[0] || null;
}

function renderKidList(){
  const T = kkDay();
  const q = state.search.trim().toLowerCase();
  let kids = db.kids.filter(k => (state.ciTab === 'alles' || k.group === state.ciTab) && (isActive(k) || state.showAll));
  const hidden = kids.filter(k => !isRecent(k)).length;
  if (!state.showAll && !q) kids = kids.filter(isRecent);
  if (q) kids = kids.filter(k => k.name.toLowerCase().includes(q));
  // Sneller inchecken: wie de laatste 12 weken het vaakst kwam staat bovenaan (gelijk = op naam)
  const since = addDays(T, -84), freq = {};
  for (const c of db.checkins) if (c.date >= since && c.date <= T) freq[c.kidId] = (freq[c.kidId] || 0) + 1;
  kids.sort((a,b) => (freq[b.id] || 0) - (freq[a.id] || 0) || byName(a,b));
  $('#kidlist').innerHTML = kids.length ? kids.map(k => {
    const c = checkinFor(k.id, T);
    const sub = !isActive(k) ? '<span style="color:var(--warn-text)">Komt niet meer</span>' : (c ? (c.items.map(itemEmoji).join(' ') || 'Ingecheckt') + (c.prayer ? ' · 🙏' : '') + ` · <span class="pts">⭐ ${pointsFor(k.group, c.items)}</span>` : (state.ciTab === 'alles' ? GROUPS[k.group] : lastSeenText(k))) + (birthdayNear(k) && !c?.items.includes('jarig') ? ' · 🎂' : '');
    return `<button class="row" data-action="openCheckin" data-id="${k.id}">
      <span class="av av-${k.group}">${initials(k.name)}</span>
      <span class="row-main"><b>${esc(k.name)}</b><span class="muted">${sub}</span></span>
      ${c ? `<span class="badge ok">${icon('check')} Ingecheckt</span>` : `<span class="btn btn-soft sm">Inchecken</span>`}
    </button>`.replace('class="row"', isActive(k) ? 'class="row"' : 'class="row" style="opacity:.6"'); }).join('')
    : `<div class="empty">${q ? `Geen kind gevonden met “${esc(state.search)}”.` : 'Geen kinderen in deze groep.'}</div>`;
  $('#allbanner').innerHTML = state.showAll
    ? `${icon('info')}<span>Je ziet nu <b>alle</b> kinderen, ook wie langer dan 60 dagen niet is geweest.</span><button class="btn btn-outline sm" data-action="toggleAll">Alleen recent</button>`
    : `${icon('info')}<span>Wie het vaakst komt staat bovenaan. Niet gevonden? Je ziet alleen kinderen die in de afgelopen 60 dagen zijn geweest${hidden ? ` (${hidden} verborgen)` : ''}.</span><button class="btn btn-outline sm" data-action="toggleAll">${icon('search')} Alle kinderen</button>`;
}
/* =====================================================================
   SMILEYS EN WAARSCHUWINGEN
   7 smileys = iets uit de grabbelbak graaien (daarna begint de telling opnieuw; wat over is telt mee).
   Waarschuwingen tellen per zondag: 1e naam op het bord, 2e streepje erachter, 3e eruit (naar ouders in de dienst).
   Alles staat als losse regels in db.marks: { kidId, date, kind:'smiley'|'warn'|'grab', author }.
   ===================================================================== */
const SMILEY_GOAL = 7;
const WARN_TEXT = ['', 'Naam op het bord', 'Streepje achter de naam', 'Eruit: naar ouders of verzorgers in de dienst'];
const marksOf = (kidId, kind, date) => db.marks.filter(m => m.kidId === kidId && m.kind === kind && (!date || m.date === date));
const smileyCount = kidId => Math.max(0, marksOf(kidId, 'smiley').length - SMILEY_GOAL * marksOf(kidId, 'grab').length);
const warnCount = (kidId, d = kkDay()) => Math.min(3, marksOf(kidId, 'warn', d).length);
function addMark(kidId, kind, extra = {}){
  const m = { id:newId(), kidId, date:kkDay(), kind, author:me().name, created_at:new Date().toISOString(), ...extra };
  db.marks.push(m); put('marks', m); save();
  return m;
}
function dropMark(m){ db.marks = db.marks.filter(x => x.id !== m.id); drop('marks', { id:m.id }); save(); }
function undoMark(kidId, kind){
  const m = marksOf(kidId, kind, kkDay()).sort((a,b) => (a.created_at || '').localeCompare(b.created_at || '')).pop();
  if (!m) return false;
  db.marks = db.marks.filter(x => x.id !== m.id); drop('marks', { id:m.id }); save();
  return true;
}
const dots = (n, cls = '') => `<span class="sdots ${cls}">${Array.from({ length:SMILEY_GOAL }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
const warnBadge = w => w ? `<span class="wb ${w === 3 ? 'w3' : ''}">⚠️ ${w}</span>` : '';

  const T = kkDay();

  const others = db.kids.filter(k => inTab(k) && !checkinFor(k.id, T)).sort(byName);
  const grab = (state.smAll ? db.kids.filter(inTab) : here).filter(k => smileyCount(k.id) >= SMILEY_GOAL).sort(byName);
  const board = db.kids.filter(k => inTab(k) && warnCount(k.id, T)).sort((a,b) => warnCount(b.id, T) - warnCount(a.id, T) || byName(a,b));
  const tabs = [['alles','Alles'],['onder','Onderbouw'],['boven','Bovenbouw'],['bezoeker','Bezoekers']];
  app.innerHTML = `
  <div class="page">
    <div class="tabs">${tabs.map(([id,l]) => `<button class="tab ${state.smTab === id ? 'active' : ''}" data-action="smTab" data-id="${id}">${l}</button>`).join('')}</div>
    <div class="page-head"><h1>Gedrag</h1><span class="muted">${cap(dayLabel(T))}</span></div>
    <div class="banner" style="margin:0 0 16px">${icon('info')}<span><b>${SMILEY_GOAL} smileys</b> = iets uit de grabbelbak graaien.
      Waarschuwingen tellen per zondag: 1e naam op het bord, 2e streepje erachter, 3e eruit en bij ouders of verzorgers in de dienst zitten.</span></div>
    ${grab.length ? `<h3 class="section-title">🎁 Mag graaien uit de grabbelbak</h3>
    <div class="card list">${grab.map(k => `
      <div class="row sm-row"><button class="sm-name" data-action="openSmiley" data-id="${k.id}"><span class="av av-${k.group}">${initials(k.name)}</span>
        <span class="row-main"><b>${esc(k.name)}</b><span class="muted">${smileyCount(k.id)} smileys</span></span></button>
        <button class="btn btn-soft sm" data-action="grabbed" data-id="${k.id}">Gegraaid</button></div>`).join('')}</div>` : ''}
    ${board.length ? `<h3 class="section-title">⚠️ Op het bord</h3>
    <div class="card list">${board.map(k => { const w = warnCount(k.id, T); return `
      <button class="row" data-action="openSmiley" data-id="${k.id}"><span class="av av-${k.group}">${initials(k.name)}</span>
        <span class="row-main"><b>${esc(k.name)}${w > 1 ? ' ' + '|'.repeat(w - 1) : ''}</b><span class="muted" style="${w === 3 ? 'color:var(--bad-text);font-weight:700' : ''}">${w}e waarschuwing: ${WARN_TEXT[w].toLowerCase()}</span></span>${warnBadge(w)}</button>`; }).join('')}</div>` : ''}
    <h3 class="section-title">Ingecheckt ${dayLabel(T)}</h3>
    <div class="card list">${here.length ? here.sort(byName).map(smRow).join('')
      : `<div class="empty">Nog niemand ingecheckt${state.smTab === 'alles' ? '' : ' in deze groep'}. Check eerst kinderen in bij Check-in.</div>`}</div>
    <p class="muted" style="font-size:13.5px;margin:10px 4px 0">Per ongeluk getikt? Tik op de naam om het terug te draaien.</p>
    <button class="btn btn-outline btn-block" style="margin-top:20px" data-action="smAll">${icon(state.smAll ? 'x' : 'users')} ${state.smAll ? 'Alle kinderen verbergen' : 'Alle kinderen'}${others.length ? ` (${others.length})` : ''}</button>
    ${state.smAll ? `<h3 class="section-title">Alle kinderen (niet ingecheckt)</h3>
    <div class="card list">${others.length ? others.map(smRow).join('') : `<div class="empty">Geen andere kinderen in deze groep.</div>`}</div>` : ''}
  </div>`;
}
function smRow(k){
  const n = smileyCount(k.id), w = warnCount(k.id); return `
      <div class="row sm-row"><button class="sm-name" data-action="openSmiley" data-id="${k.id}"><span class="av av-${k.group}">${initials(k.name)}</span>

          <button class="btn btn-outline" data-action="undoWarn" data-id="${id}" ${w ? '' : 'disabled'}>↩︎ Terug</button>
        </div></div>

function lastSeenText(k){
  const ls = lastSeen(k.id);
  if (!ls) return 'Nog niet geweest';
  const weeks = Math.round((new Date(todayISO()) - new Date(ls)) / 6048e5);
  return ls === todayISO() ? 'Vandaag' : weeks === 0 ? 'Afgelopen zondag' : weeks === 1 ? 'Vorige week geweest' : `${weeks} weken geleden`;
}

          ${sung ? `<div style="margin-top:8px;font-weight:600">🎉 Al gezongen op ${fmtDate(sung, {day:'numeric', month:'long'})}</div>`

      ${fresh || items.has('nieuw') ? `<div class="hint soft" style="display:block;background:var(--ok-soft);color:var(--text)">🌟 ${esc(firstName(k.name))} is nieuw!
        <div style="margin-top:10px"><button type="button" class="chip ${items.has('nieuw') ? 'on' : ''}" data-action="toggleChip" data-id="nieuw">🌟 Nieuw kind <span class="pts">+${pointsCfg()[k.group]?.nieuw ?? 0} punten</span><span class="tick">✓</span></button></div></div>` : ''}

/* Lijkt een naam op een kind dat er al is? (hoofdletters, accenten en kleine typfouten tellen niet) */
const normName = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
function editDistance(a, b){
  const d = Array.from({ length:a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function similarKids(name, exceptId){
  const n = normName(name); if (n.length < 2) return [];
  const nf = n.split(' ')[0];
  return db.kids.filter(k => k.id !== exceptId).filter(k => {
    const m = normName(k.name), mf = m.split(' ')[0];
    if (m === n || m.startsWith(n + ' ') || n.startsWith(m + ' ')) return true;          // zelfde naam, of alleen de voornaam
    if (editDistance(nf, mf) <= (Math.min(nf.length, mf.length) >= 5 ? 1 : 0) && editDistance(n, m) <= 2) return true;   // kleine typfout (voornaam bijna gelijk; broertjes/zusjes niet)
    return nf.length >= 3 && nf === mf && (n === nf || m === mf);
  }).slice(0, 4);
}
const similarHint = name => (l => l.length ? `<div class="hint" style="display:block;margin:-6px 0 14px">⚠️ Lijkt op: ${l.map(k => `<b>${esc(k.name)}</b> (${GROUPS[k.group].toLowerCase()})`).join(', ')}. Bestaat dit kind al? Zoek het dan op in de lijst.</div>` : '')(similarKids(name));

const validEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
/* Geeft '' (leeg), het nette e-mailadres, of false bij een fout (dan is err() al aangeroepen) */
function checkEmail(raw, ownId, err){
  const email = (raw || '').trim().toLowerCase();
  if (!email) return '';
  if (!validEmail(email)){ err('Vul een geldig e-mailadres in.'); return false; }
  if (db.leaders.some(l => l.email === email && l.id !== ownId)){ err('Dit e-mailadres hoort al bij iemand anders in het team.'); return false; }
  return email;
}

/* ---------- Kinderen importeren ----------
   Echte namen komen NIET in de code (de repository is openbaar). Ze worden hier ingevoerd:
   demomodus = alleen in deze browser, databasemodus = in Supabase (alleen zichtbaar voor ingelogde leiding). */
const groupOf = t => /boven/i.test(t) ? 'boven' : /onder/i.test(t) ? 'onder' : /bezoek|gast/i.test(t) ? 'bezoeker' : null;
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
/* Geboortedatum uit "9-10-2013", "9/10/2013", "2013-10-09" of "9 oktober 2013"; null als het geen (geldige) datum is */
function parseBirthdate(t){
  t = t.trim().toLowerCase();
  let y, m, d, x;
  if ((x = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = x;
  else if ((x = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) [, d, m, y] = x;
  else if ((x = t.match(/^(\d{1,2})\s+([a-zé]+)\.?\s+(\d{4})$/))){ d = x[1]; y = x[3]; m = MONTHS.findIndex(n => n.startsWith(x[2].slice(0, 3))) + 1; if (!m) return null; }
  else return null;
  const str = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const dt = new Date(str + 'T12:00:00');
  return isNaN(dt) || iso(dt) !== str || str > todayISO() ? null : str;   // geen 31 februari, niet in de toekomst
}
function parseImport(text, fallback, skipDemo){
  const rows = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    let parts = line.split(/[;\t]/).map(x => x.trim().replace(/^"|"$/g, '')).filter(Boolean);
    if (parts.length === 1 && line.includes(',')) parts = line.split(',').map(x => x.trim().replace(/^"|"$/g, '')).filter(Boolean);
    if (i === 0 && /^naam\b/i.test(parts[0])) return;            // kopregel uit een export
    let group = null, birthdate = null, badDate = false;
    const nameParts = [parts[0]];
    parts.slice(1).forEach(p => {
      const g = groupOf(p), d = parseBirthdate(p);
      if (g) group = g; else if (d) birthdate = d; else if (/\d{4}/.test(p)) badDate = true; else nameParts.push(p);
    });
    const name = nameParts.join(' ').replace(/\s+/g, ' ');
    if (name) rows.push({ name, group:group || fallback, birthdate, badDate });
  });
  // Dubbel = zelfde naam in dezelfde groep (twee kinderen met dezelfde naam in verschillende groepen mag)
  const key = (n, g) => n.toLowerCase() + '|' + g;
  const seen = new Set(db.kids.filter(k => !(skipDemo && isDemoKid(k))).map(k => key(k.name, k.group)));
  return rows.map(r => { const k = key(r.name, r.group), dup = seen.has(k); seen.add(k); return { ...r, dup }; });
}

  app.innerHTML = `

    <div class="banner" style="margin:0 0 16px">${icon('info')}<span>${CLOUD

    <div class="card pad">

/* ---------- Historie ---------- */
function renderHistorie(){
  const T = todayISO();
  const from = addDays(T, -7*16);
  const counts = {};
  db.checkins.forEach(c => { if (c.date >= from && c.date <= T && kidById(c.kidId)) counts[c.date] = (counts[c.date] || 0) + 1; });
  const dates = Object.keys(counts).sort();
  const avg = dates.length ? Math.round(dates.reduce((s,d) => s + counts[d], 0) / dates.length) : 0;
  const max = Math.max(5, ...Object.values(counts));

  const W = 720, H = 260, pl = 30, pb = 34, pt = 18, cw = W - pl - 10, ch = H - pb - pt;
  const step = Math.ceil(max / 5 / 5) * 5 || 5, top = Math.ceil(max / step) * step;
  const bw = Math.min(30, cw / Math.max(dates.length, 1) * .6);
  let svg = '';
  for (let v = 0; v <= top; v += step){ const y = pt + ch - v / top * ch;
    svg += `<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" style="stroke:var(--border)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`; }
  dates.forEach((d,i) => {
    const x = pl + (i + .5) * cw / dates.length, h = counts[d] / top * ch, y = pt + ch - h;
    svg += `<rect x="${x - bw/2}" y="${y}" width="${bw}" height="${h}" rx="5" style="fill:${d === T ? 'var(--brand)' : 'color-mix(in srgb, var(--brand) 50%, var(--card))'}"><title>${fmtDate(d)}: ${counts[d]} kinderen</title></rect>
      <text x="${x}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--text)">${counts[d]}</text>
      <text x="${x}" y="${H - 12}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${fmtDate(d, {day:'numeric', month:'short'}).replace('.', '')}</text>`;
  });

  const eightWeeks = addDays(T, -56);
  const rows = grp => db.kids.filter(k => k.group === grp && isRecent(k)).sort(byName).map(k => {
    const n = db.checkins.filter(c => c.kidId === k.id && c.date > eightWeeks).length;
    return `<tr class="click" data-action="openKid" data-id="${k.id}"><td><b>${esc(k.name)}</b></td><td class="muted">${lastSeen(k.id) ? fmtDate(lastSeen(k.id), {day:'numeric', month:'short'}) : '—'}</td>
      <td class="c">${n}×</td><td class="c">${n >= 4 ? `<span class="okmark">${icon('check')}</span>` : '<span class="muted">–</span>'}</td></tr>`; }).join('');
  const table = (grp) => `<h3 class="section-title">${GROUPS[grp]}</h3><div class="card list" style="overflow-x:auto"><table class="t">
    <thead><tr><th>Naam</th><th>Laatst</th><th class="c">8 wkn</th><th class="c">1×/2 wk</th></tr></thead><tbody>${rows(grp) || '<tr><td colspan="4" class="muted">Geen kinderen</td></tr>'}</tbody></table></div>`;

  app.innerHTML = `
  <div class="page">
    <div class="page-head"><h1>Historie</h1><span class="muted">Gemiddeld ${avg} kinderen per keer</span></div>
    <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aantal kinderen per zondag">${svg}</svg></div>
    <div class="banner">${icon('info')}<span>Hieronder zie je de kinderen die in de afgelopen 60 dagen zijn geweest. Een vinkje betekent: minstens 4 keer in de laatste 8 weken.</span></div>
    ${table('onder')}${table('boven')}${table('bezoeker')}
  </div>`;
}

/* ---------- Quiz (week 7) ----------
   Bovenbouw-leiding zet in de week zelf vragen klaar (knop bij het programma op Home, of hier); in week 7 speel je de quiz
   of download je hem als PowerPoint of spreadsheet. Onderbouw ziet dit niet.
   Opslag in de bestaande tabel notes, met text = 'quiz:{"q":…,"a":…}' (open vraag) of 'quiz:{"q":…,"opts":[…],"ok":0}' (meerkeuze). */
const QUIZ_PREFIX = 'quiz:';
const LETTERS = ['A','B','C','D'];
const quizOf = n => { if (!n.text || !n.text.startsWith(QUIZ_PREFIX)) return null; try { return JSON.parse(n.text.slice(QUIZ_PREFIX.length)); } catch(e){ return null; } };
const isMc = x => Array.isArray(x.opts) && x.opts.length > 1;
const okList = x => Array.isArray(x.ok) ? x.ok : [x.ok ?? 0];   // goede antwoorden (oude vragen: één getal)
const quizAnswer = x => isMc(x) ? okList(x).map(i => `${LETTERS[i]}: ${x.opts[i]}`).join(' + ') : x.a || '';
const canQuiz = () => me().group === 'boven' || isAdmin();
const quizDate = () => nextSunday(todayISO());   // de zondag van deze week (op zondag: vandaag)
const quizPeriod = () => (weekInfo(kkDay()) || weekInfo(quizDate()))?.p || null;
const quizList = p => db.notes.filter(n => quizOf(n) && n.date >= p.start && n.date <= addDays(periodEnd(p), 6)).sort((a,b) => a.date.localeCompare(b.date));
const quizOnDate = d => db.notes.filter(n => quizOf(n) && n.date === d);
const quizCount = n => `${n} vra${n === 1 ? 'ag' : 'gen'}`;
/* Formulier voor een vraag: open vraag of meerkeuze A–D (tik op de letter van het goede antwoord) */
function quizForm(x = { q:'', a:'' }){
  const mc = isMc(x), ok = mc ? okList(x) : [0];
  return `
    <label class="field"><span>Vraag</span><textarea id="qf-q" rows="2" placeholder="Bijv. Wat maakte God op de vierde dag?">${esc(x.q)}</textarea></label>
    <div class="seg qf-type" style="margin-bottom:12px"><button type="button" class="${mc ? '' : 'on'}" data-action="qfType" data-id="open">Open vraag</button><button type="button" class="${mc ? 'on' : ''}" data-action="qfType" data-id="mc">Meerkeuze A–D</button></div>
    <div id="qf-open" ${mc ? 'hidden' : ''}><label class="field"><span>Antwoord <span class="muted" style="font-weight:400">(mag leeg)</span></span><input id="qf-a" value="${esc(mc ? '' : x.a || '')}" autocomplete="off" placeholder="Bijv. De zon, de maan en de sterren"></label></div>
    <div id="qf-mc" ${mc ? '' : 'hidden'}>
      <div class="muted" style="font-size:14px;margin-bottom:8px">Tik op de letter van het goede antwoord. Zijn er meer goed? Tik ze allemaal aan. C en D mogen leeg.</div>
      ${LETTERS.map((L, i) => `<div class="qf-opt"><button type="button" class="qf-letter ${ok.includes(i) ? 'on' : ''}" data-action="qfOk" data-id="${i}" title="Goed antwoord aan/uit">${L}</button>
        <input id="qf-o${i}" value="${esc(mc ? x.opts[i] || '' : '')}" autocomplete="off" placeholder="Antwoord ${L}"></div>`).join('')}
    </div>`;
}
function readQuizForm(){
  const q = $('#qf-q').value.trim();
  if (!q){ $('#qf-q').focus(); return null; }
  if ($('#qf-mc').hidden) return { q, a:$('#qf-a').value.trim() };
  const raw = LETTERS.map((_, i) => $('#qf-o' + i).value.trim());
  const okRaw = [...document.querySelectorAll('.qf-letter.on')].map(b => +b.dataset.id);
  if (!okRaw.length){ toast('Tik op de letter van het goede antwoord'); return null; }
  if (okRaw.some(i => !raw[i])){ toast('Een goed antwoord is nog leeg: vul het in of tik de letter uit'); return null; }
  const keep = raw.map((t, i) => t ? i : -1).filter(i => i >= 0);   // lege C/D weglaten, letters schuiven op
  if (keep.length < 2){ toast('Vul minstens twee antwoorden in'); return null; }
  return { q, opts:keep.map(i => raw[i]), ok:keep.map((i, j) => okRaw.includes(i) ? j : -1).filter(j => j >= 0) };
}
function quizWeekLabel(d){ const w = weekInfo(d); return `${w ? `Week ${w.week} · ` : ''}${sundayTopic(d, 'boven').theme || fmtDate(d, {day:'numeric', month:'long'})}`; }

      || `<div class="banner">${icon('info')}<span>Nog geen vragen. Bedenk elke week een paar vragen over het thema, bijvoorbeeld tijdens de preek. Op Home staat daarvoor een knop bij het programma. In week 7 speel of download je de quiz hier.</span></div>`}

  const n = db.notes.find(x => x.id === id), x = n && quizOf(n); if (!x) return;

/* Quiz spelen: tik op een antwoord, de app zegt goed of fout en laat de goede antwoorden zien.
   Open vraag: "Antwoord tonen". state.quizPick = gekozen letter (null = nog niet), state.quizShow = antwoord zichtbaar. */
function openQuizPlay(){
  const p = quizPeriod(), list = p ? quizList(p) : [];
  if (!list.length) return;
  const i = Math.min(state.quizIdx || 0, list.length - 1), x = quizOf(list[i]), show = state.quizShow;
  const pick = state.quizPick, oks = isMc(x) ? okList(x) : [], good = pick != null && oks.includes(pick);
  const optCls = j => !show ? '' : oks.includes(j) ? 'ok' : j === pick ? 'bad' : 'dim';
  openModal(`
    <div class="quiz-play">
      <div class="qp-top"><span class="muted">Vraag ${i + 1} van ${list.length}</span><button class="icon-btn" data-action="closeModal">${icon('x')}</button></div>
      <div class="qp-q">${esc(x.q)}</div>

/* Google Slides: de PowerPoint gaat naar een Google Apps Script van de beheerder (google/quiz-naar-slides.gs, URL in

    const res = await (await fetch(CFG.slidesScript, { method:'POST', body:JSON.stringify({ token, name, data }) })).json();   // text/plain: geen extra CORS-vraag

async function makeQuizPptx(slides){

  const BLUE = '1D3C9C', FONT = 'Arial', COLORS = ['E5484D','1D7AE0','E9A23B','8E4EC6'];
  const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE'; pptx.title = 'Quiz ' + p.theme;   // 13,33 × 7,5 inch

  s0.addText('Quiz', { x:0.5, y:2.9, w:12.33, h:1.4, fontFace:FONT, fontSize:66, bold:true, color:'FFFFFF', align:'center' });
  s0.addText(periodLabel(p), { x:0.5, y:4.3, w:12.33, h:0.8, fontFace:FONT, fontSize:30, color:'FFFFFF', align:'center' });
  s0.addText('Kinderkerk De Deur', { x:0.5, y:6.3, w:12.33, h:0.5, fontFace:FONT, fontSize:16, color:'C9D5FF', align:'center' });
  const slide = (x, i, answer) => {
    const s = pptx.addSlide(); s.background = { color:'FFFFFF' };
    s.addShape(pptx.ShapeType.rect, { x:0, y:0, w:13.33, h:0.75, fill:{ color:BLUE } });
    s.addText(`Vraag ${i + 1} van ${list.length}${answer ? ' · antwoord' : ''}`, { x:0.5, y:0.1, w:12.3, h:0.55, fontFace:FONT, fontSize:18, bold:true, color:'FFFFFF' });
    s.addText(x.q, { x:0.6, y:1.0, w:12.1, h:isMc(x) ? 2.1 : 3.2, fontFace:FONT, fontSize:x.q.length > 90 ? 32 : 40, bold:true, color:'1A2233', valign:'middle', fit:'shrink' });
    if (isMc(x)) x.opts.forEach((o, j) => {

      s.addText(`${LETTERS[j]}   ${o}${good ? '   ✓' : ''}`, { x:bx + 0.3, y:by, w:5.4, h:1.6, fontFace:FONT, fontSize:o.length > 40 ? 20 : 26, bold:true, color:dim ? '8A93A6' : 'FFFFFF', valign:'middle', fit:'shrink' });
    });
    else if (answer) {
      s.addShape(pptx.ShapeType.roundRect, { x:0.6, y:4.5, w:12.1, h:2.0, rectRadius:0.15, fill:{ color:'E4F5EB' }, line:{ color:'2FA36B', width:3 } });
      s.addText(x.a || '(geen antwoord ingevuld)', { x:0.9, y:4.5, w:11.5, h:2.0, fontFace:FONT, fontSize:32, bold:true, color:'1F7A4D', valign:'middle', fit:'shrink' });
    }
  };
  list.forEach((n, i) => { const x = quizOf(n); slide(x, i, false); slide(x, i, true); });
  const end = pptx.addSlide(); end.background = { color:BLUE };
  end.addText('Goed gedaan! 🎉', { x:0.5, y:2.8, w:12.33, h:1.5, fontFace:FONT, fontSize:60, bold:true, color:'FFFFFF', align:'center' });

  // Andere apps negeren dat, maar PowerPoint (ook online) weigert het bestand dan. Die regels halen we eruit.
  const zip = await JSZip.loadAsync(await pptx.write({ outputType:'blob' }));

  const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  if (slides && CFG.slidesScript) return toSlides(blob, quizFileName(p, 'pptx'));

/* ---------- Gebedslijst ---------- */
/* =====================================================================
   GEBED
   Op zondag: wie bidt voor welk gebedspunt (alle ingecheckte kinderen) en 1 kind van de onderbouw voor de collecte.
   Eerlijk: wie het minst vaak aan de beurt was, gaat voor (ook kinderen die niet vaak komen); bij gelijk aantal
   wie het langst geleden was, daarna toeval. Beurten staan in db.marks (kind 'pray' met ref = gebedspunt, 'collecte').
   Losse gebedspunten (niet bij het inchecken) zijn marks met kind 'prayer' en de tekst in note.
   ===================================================================== */
const isSunday = d => weekday(d) === 0;
const prayDay = () => { const T = todayISO(); return isSunday(T) || checkinsOn(T).length ? T : demoAnchor(T); };   // vandaag, of de laatste zondag
const kkDay = prayDay;   // de kinderkerkdag waar check-in, Gedrag, Gebed en Sheets over gaan: vandaag op zondag, anders afgelopen zondag
/* "vandaag" alleen voor vandaag; doordeweeks "afgelopen zondag 18 oktober" of "aankomende zondag 25 oktober" */
function dayLabel(d){
  const T = todayISO(), dm = fmtDate(d, { day:'numeric', month:'long' });
  if (d === T) return 'vandaag';
  if (!isSunday(T) && d === demoAnchor(T)) return 'afgelopen zondag ' + dm;
  if (d === nextSunday(T)) return 'aankomende zondag ' + dm;
  return fmtDate(d, { weekday:'long', day:'numeric', month:'long' });
}
function prayerPoints(d){
  return [...checkinsOn(d).filter(c => c.prayer).map(c => ({ id:c.id, kidId:c.kidId, text:c.prayer })),
          ...db.marks.filter(m => m.kind === 'prayer' && m.date === d && kidById(m.kidId)).map(m => ({ id:m.id, kidId:m.kidId, text:m.note || '', loose:m }))];
}
function allPrayers(kidId){   // alle gebedspunten (van één kind), nieuwste eerst
  return [...db.checkins.filter(c => c.prayer && (!kidId || c.kidId === kidId) && kidById(c.kidId)).map(c => ({ id:c.id, kidId:c.kidId, date:c.date, text:c.prayer })),
          ...db.marks.filter(m => m.kind === 'prayer' && (!kidId || m.kidId === kidId) && kidById(m.kidId)).map(m => ({ id:m.id, kidId:m.kidId, date:m.date, text:m.note || '', loose:m }))]
    .sort((a,b) => b.date.localeCompare(a.date));
}
/* Eerlijk kiezen: minst vaak aan de beurt → langst geleden → toeval */
function fairPick(cands, turns, avoid = []){
  const pool = cands.filter(k => !avoid.includes(k.id)); if (!pool.length) return null;
  return pool.map(k => { const t = turns(k.id); return { k, n:t.length, last:t.reduce((m,x) => x > m ? x : m, ''), r:Math.random() }; })
    .sort((a,b) => a.n - b.n || a.last.localeCompare(b.last) || a.r - b.r)[0].k;
}
const prayTurns = kind => kidId => db.marks.filter(m => m.kidId === kidId && m.kind === kind).map(m => m.date);
const sheetTurns = kidId => db.rosters.sheets.filter(r => r.kidId === kidId && r.date <= todayISO()).map(r => r.date);
const prayMarks = d => db.marks.filter(m => m.date === d && (m.kind === 'pray' || m.kind === 'collecte'));
function pickPrayer(d, point){

  logout: async () => {
    if (CLOUD){
      if (outbox.length && !confirm(`Er ${outbox.length === 1 ? 'is nog 1 wijziging' : `zijn nog ${outbox.length} wijzigingen`} niet opgeslagen omdat er geen internet is. Toch uitloggen? Dan gaan ze verloren.`)) return;
      outbox = []; keepOutbox(); sessionUser = null;
      try { localStorage.removeItem(CACHE_KEY); } catch(e){}
      await sb.auth.signOut().catch(() => {}); db = emptyDb(); syncBadge();
    }
    db.session = null; save(); closeModal(); state.auth = { step:'email' }; location.hash = '#/home'; render();
  },
  sendLink: async () => {
    const email = $('#lg-email').value.trim().toLowerCase();
    if (!validEmail(email)){ state.auth = { step:'email', email, error:'Vul een geldig e-mailadres in.' }; return render(); }
    if (CLOUD){
      state.auth = { step:'email', email, busy:true }; render();
      const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
      if (!error){ state.auth = { step:'sent', email }; return render(); }
      console.error(error);
      const msg = error.status === 429 || /rate|seconds/i.test(error.message) ? 'Je hebt het net al geprobeerd. Wacht even en probeer het opnieuw.'
        : /database|uitgenodigd|signup/i.test(error.message) ? 'Dit e-mailadres is (nog) niet uitgenodigd. Vraag een beheerder van de kinderkerk om je uit te nodigen.'
        : 'Er ging iets mis. Controleer je internet en probeer het opnieuw.';
      state.auth = { step:'email', email, error:msg }; return render();
    }
    const known = db.leaders.some(l => l.email === email && l.invited);
    if (!known){ state.auth = { step:'email', email, error:'Dit e-mailadres is (nog) niet uitgenodigd. Vraag een beheerder van de kinderkerk om je uit te nodigen.' }; return render(); }
    state.auth = { step:'sent', email }; render();

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.input;
  if (k === 'search'){ state.search = e.target.value; renderKidList(); }
  if (k === 'kidName'){ const el = $('#kid-similar'); if (el) el.innerHTML = similarHint(e.target.value); }
  if (k === 'zsearch'){ state.zSearch = e.target.value; renderZList(); }
  if (k === 'importText') renderImportPreview();
  if (k === 'agTitle' || k === 'agNotes'){
    const a = db.agenda.find(x => x.id === e.target.dataset.id); if (!a) return;
    if (k === 'agTitle') a.title = e.target.value.replace(/\n/g, ' '); else a.notes = e.target.value;
    grow(e.target);
    autosave('agenda_items', a);
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset?.change === 'importPreview') renderImportPreview();
  if (e.target.dataset?.change === 'backupFile' && e.target.files[0]) (CLOUD ? cloudImportFile : restoreBackup)(e.target.files[0]);
  if (e.target.dataset?.change === 'notulist'){ const m = db.meetings.find(x => x.id === e.target.dataset.id); if (m){ m.notulist = e.target.value || null; put('meetings', m); save(); toast('Notulist opgeslagen'); } }
  if (e.target.dataset?.change === 'ciDate') openCheckin(e.target.dataset.id, e.target.value || kkDay());
});
document.addEventListener('submit', e => {
  const k = e.target.dataset?.submit; if (!k) return;
  e.preventDefault(); actions[k]?.(e.target.dataset, e.target, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// iPhone negeert user-scalable=no in Safari; knijp-zoom daarom ook hier tegenhouden
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
window.addEventListener('hashchange', router);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  // Nieuwe versie binnen? Dan één keer herladen, zodat je meteen de nieuwste app hebt.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(r => r.update()).catch(() => {});
}

applyTheme();
$('#mini-logo').innerHTML = logoImg();
if (CLOUD){
  state.auth = { step:'loading' }; router();
  sb.auth.getSession().then(({ data }) => {
    if (data.session) afterLogin(data.session.user);
    else if (!navigator.onLine && openFromCache()) {}   // geen internet en inlog nog niet vernieuwd: toch openen
    else { state.auth = { step:'email' }; render(); }
  }).catch(() => { if (!openFromCache()){ state.auth = { step:'email' }; render(); } });
  listen();
} else router();
</script>
</body>
</html>
